<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Atelier — Planning du jour</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6a2b">
<style>
  :root{
    --bg: #14161a;
    --panel: #1d2027;
    --panel-2: #262a33;
    --line: #33384433;
    --line-solid: #383d47;
    --accent: #ff6a2b;
    --accent-dim: #ff6a2b22;
    --done: #3ecf8e;
    --done-dim: #3ecf8e22;
    --cours: #4a9eff;
    --cours-dim: #4a9eff22;
    --courtesy: #a78bfa;
    --courtesy-dim: #a78bfa22;
    --text: #f2f0ea;
    --text-dim: #9aa0ab;
    --mono: 'SF Mono', 'Consolas', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; overflow-x:hidden;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    padding:18px 28px; border-bottom:1px solid var(--line-solid);
    background: linear-gradient(180deg, #191c22, #14161a);
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand .dot{width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px var(--accent);}
  .brand h1{font-size:15px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; margin:0; color:var(--text-dim);}
  .brand .date{font-size:20px; font-weight:700; margin-top:2px; text-transform:capitalize;}
  .status{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:12px; color:var(--text-dim);}
  .status .led{width:8px; height:8px; border-radius:50%; background:#555;}
  .suite-tabs{display:flex; gap:4px; background:var(--panel-2); padding:4px; border-radius:10px; border:1px solid var(--line-solid);}
  .tab-link{
    padding:8px 14px; border-radius:7px; font-size:12px; font-weight:600; text-decoration:none;
    color:var(--text-dim); white-space:nowrap;
  }
  .tab-link.active{background:var(--accent); color:#1a0d05;}
  .tab-link:not(.active):hover{color:var(--text);}
  .status .led.live{background:var(--done); box-shadow:0 0 8px var(--done);}
  .status .led.lost{background:#ff5555; box-shadow:0 0 8px #ff5555; display:inline-block; margin-right:8px;}
  .reconnect-btn{
    display:flex; align-items:center; background:#ff555522; border:1px solid #ff5555;
    color:#ff9c9c; padding:8px 14px; border-radius:8px; font-size:12px; font-weight:700;
    cursor:pointer; font-family:inherit; animation: pulse-glow 1.6s ease-in-out infinite;
  }
  @keyframes pulse-glow{
    0%, 100%{ box-shadow:0 0 0 0 #ff555555; }
    50%{ box-shadow:0 0 0 6px #ff555500; }
  }
  .status button{
    background:var(--panel-2); border:1px solid var(--line-solid); color:var(--text);
    padding:8px 14px; border-radius:8px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .status button:active{transform:scale(.96);}

  .counts{display:flex; gap:10px; padding:16px 28px 0;}
  .pill{
    font-family:var(--mono); font-size:12px; padding:6px 12px; border-radius:20px;
    border:1px solid var(--line-solid); color:var(--text-dim);
  }
  .pill b{color:var(--text); font-size:14px;}

  .list{padding:16px 28px 40px; display:flex; flex-direction:column; gap:10px;}

  .day-header{
    display:flex; align-items:baseline; gap:10px; margin:22px 0 4px; padding-bottom:8px;
    border-bottom:1px solid var(--line-solid);
  }
  .day-header:first-child{margin-top:0;}
  .day-header .label{font-size:16px; font-weight:700; text-transform:capitalize;}
  .day-header .today-tag{
    font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.05em;
    background:var(--accent); color:#1a0d05; padding:3px 8px; border-radius:6px; text-transform:uppercase;
  }
  .day-header .count{font-size:12px; color:var(--text-dim); margin-left:auto; font-family:var(--mono);}

  .multiday-tag{
    display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    background:var(--panel-2); border:1px solid var(--line-solid); color:var(--text-dim);
    padding:2px 7px; border-radius:6px; margin-top:2px;
  }

  .card{
    display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--line-solid); border-radius:14px;
    overflow:hidden; transition: opacity .25s, transform .15s;
  }
  .card.done{opacity:.7;}
  .card.paused{opacity:.78;}
  .card.paused .time{background:#ffc94622;}
  .card.inprogress .time{background:var(--cours-dim);}
  .card.has-courtesy{border-left:3px solid var(--courtesy);}
  .courtesy-badge{
    display:inline-block; background:var(--courtesy-dim); color:var(--courtesy);
    padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700; margin-top:4px;
  }
  .modal .field select{
    width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--line-solid);
    background:var(--panel-2); color:var(--text); font-family:inherit; font-size:14px;
  }
  .card-top{display:flex; align-items:stretch;}
  .card-actions{display:flex; border-top:1px solid var(--line-solid);}
  .action-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:12px 6px; background:var(--panel-2); border:none; border-right:1px solid var(--line-solid);
    color:#c2c8d2; font-family:inherit; font-size:12px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; cursor:pointer;
  }
  .action-btn:last-child{border-right:none;}
  .action-btn svg{width:16px; height:16px; opacity:.75;}
  .action-btn.cours-btn.on{background:#4a9eff3d; color:#7ec2ff;}
  .action-btn.cours-btn.on svg{opacity:1;}
  .action-btn.pause-btn.on{background:#ffc9463d; color:#ffd873;}
  .action-btn.pause-btn.on svg{opacity:1;}
  .action-btn.done-btn.on{background:#3ecf8e3d; color:#6fe0ac;}
  .action-btn.done-btn.on svg{opacity:1;}
  .card .time{
    width:118px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--panel-2); font-family:var(--mono); font-weight:700; font-size:14px; border-right:1px solid var(--line-solid);
    text-align:center; line-height:1.5;
  }
  .card .time .arrow{display:block; font-size:10px; color:var(--text-dim); font-weight:400; margin:2px 0;}
  .card .time span{font-size:10px; font-weight:400; color:var(--text-dim); margin-top:2px;}
  .card .body{flex:1; padding:14px 18px; display:flex; flex-direction:column; gap:4px; min-width:0;}
  .card .model{font-size:17px; font-weight:700;}
  .card .presta{font-size:13px; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .card .phone{font-size:13px; color:var(--text-dim); font-family:var(--mono);}
  .card .raw{font-size:13px; color:var(--text-dim);}
  .comment-text{
    font-size:13px; color:var(--text-dim); font-style:italic; margin-top:2px;
    padding:6px 10px; background:var(--panel-2); border-radius:8px; border-left:2px solid var(--accent);
  }
  .comment-btn{
    font-size:12px; color:var(--accent); margin-top:4px; cursor:pointer; width:fit-content;
  }
  .tool-tag{
    display:inline-block; background:var(--panel-2); border:1px solid var(--line-solid);
    padding:1px 7px; border-radius:5px; font-size:10px; margin-left:6px; color:var(--text-dim);
    text-transform:none; letter-spacing:0; font-weight:600;
  }
  .attachments-list{display:flex; flex-direction:column; gap:3px; margin-top:6px;}
  .attachment-link{
    font-size:12px; color:var(--cours); cursor:pointer; width:fit-content;
  }
  .attachment-link:hover{text-decoration:underline;}

  .modal-overlay{
    position:fixed; inset:0; background:#000a; display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--line-solid); border-radius:16px;
    padding:24px; width:100%; max-width:440px;
  }
  .modal h3{margin:0 0 14px; font-size:16px;}
  .modal textarea{
    width:100%; min-height:110px; padding:12px 14px; padding-right:52px; border-radius:10px; border:1px solid var(--line-solid);
    background:var(--panel-2); color:var(--text); font-family:inherit; font-size:14px; resize:vertical;
  }
  .textarea-wrap{position:relative;}
  .voice-btn{
    position:absolute; bottom:10px; right:10px; width:36px; height:36px; border-radius:50%;
    border:1px solid var(--line-solid); background:var(--panel); color:var(--text-dim);
    font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: all .15s;
  }
  .voice-btn.listening{
    background:#ff5555; border-color:#ff5555; color:white;
    animation: pulse-glow 1.2s ease-in-out infinite;
  }
  .modal .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal .modal-actions button{
    flex:1; padding:12px; border-radius:10px; border:none; font-weight:700; font-size:14px; cursor:pointer;
  }
  .modal .btn-save{background:var(--accent); color:#1a0d05;}
  .modal .btn-cancel{background:var(--panel-2); color:var(--text); border:1px solid var(--line-solid) !important;}
  .modal .field{margin-bottom:14px;}
  .modal .field label{display:block; font-size:11px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
  .modal .field.required label::after{content:' *'; color:var(--accent);}
  .modal .field input{
    width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--line-solid);
    background:var(--panel-2); color:var(--text); font-family:inherit; font-size:14px;
  }
  .perf-summary{font-size:12px; color:var(--text-dim); margin-top:6px; font-family:var(--mono);}
  .mini-cal{background:var(--panel-2); border:1px solid var(--line-solid); border-radius:10px; padding:12px; margin-top:4px; max-width:480px;}
  .mc-loading{display:block; text-transform:none; letter-spacing:0; font-size:12px; color:var(--text-dim); font-weight:400; margin-bottom:10px;}
  .mc-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .mc-title{font-size:13px; font-weight:700; text-transform:capitalize; color:var(--text);}
  .mc-nav{background:var(--panel); border:1px solid var(--line-solid); color:var(--text); width:26px; height:26px; border-radius:6px; cursor:pointer; font-size:14px; line-height:1;}
  .mc-nav:disabled{opacity:.3; cursor:default;}
  .mc-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10px; color:var(--text-dim); margin-bottom:5px; font-weight:600;}
  .mc-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .mc-cell{
    position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:6px; font-size:12px; cursor:pointer; background:var(--panel); color:var(--text);
  }
  .mc-day{display:flex; flex-direction:column; align-items:center; line-height:1.05;}
  .mc-day small{font-size:7px; text-transform:uppercase; color:var(--text-dim); font-weight:600; margin-top:1px;}
  .mc-cell.mc-selected .mc-day small{color:#1a0d05aa;}
  .mc-cell.mc-empty{visibility:hidden; cursor:default;}
  .mc-cell.mc-busy{background:var(--accent-dim); color:var(--accent); font-weight:600;}
  .mc-cell.mc-selected{background:var(--accent); color:#1a0d05; font-weight:700;}
  .mc-count{
    position:absolute; bottom:1px; right:1px; font-size:8px; background:var(--accent); color:#1a0d05;
    border-radius:50%; width:13px; height:13px; display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .mc-cell.mc-selected .mc-count{background:#1a0d05; color:var(--accent);}
  .modal-newevent{max-width:none; width:98vw; max-height:96vh; overflow-y:auto;}
  .modal-assistant{max-width:560px;}
  .chat-messages{max-height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; margin-bottom:14px; padding:4px;}
  .chat-bubble{padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.45; max-width:85%;}
  .chat-bubble.user{background:var(--accent); color:#1a0d05; align-self:flex-end;}
  .chat-bubble.assistant{background:var(--panel-2); color:var(--text); align-self:flex-start;}
  .chat-bubble.tool-info{background:transparent; border:1px dashed var(--line-solid); color:var(--text-dim); font-size:12px; align-self:center; font-style:italic; max-width:95%;}
  .chat-input-row{display:flex; gap:8px;}
  .chat-input-row input{flex:1; padding:11px 13px; border-radius:9px; border:1px solid var(--line-solid); background:var(--panel-2); color:var(--text); font-family:inherit; font-size:14px;}
  .chat-input-row button{padding:11px 18px; border-radius:9px; border:none; background:var(--accent); color:#1a0d05; font-weight:700; cursor:pointer;}
  .modal-newevent .newevent-left{flex:0 0 360px;}
  .modal-newevent .newevent-right{flex:1 1 600px;}
  .month-summary{
    display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;
  }
  .month-summary .pill{font-family:var(--mono); font-size:12px; padding:6px 12px; border-radius:20px; border:1px solid var(--line-solid); color:var(--text-dim);}
  .month-summary .pill b{color:var(--text); font-size:14px;}
  .newevent-columns{display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start;}
  .newevent-left{flex:1 1 340px; min-width:280px;}
  .newevent-right{flex:1 1 340px; min-width:280px; border-left:1px solid var(--line-solid); padding-left:28px;}
  @media (max-width: 720px){
    .newevent-right{border-left:none; padding-left:0; border-top:1px solid var(--line-solid); padding-top:20px; margin-top:8px;}
  }
  .day-agenda-title{font-size:13px; font-weight:700; margin-bottom:12px; text-transform:capitalize; color:var(--text);}
  #dayAgendaPanel .search-result{margin-bottom:8px; padding:12px 14px;}
  #dayAgendaPanel .search-result.multiday{padding:7px 12px; opacity:.75;}
  #dayAgendaPanel .search-result.multiday .sr-title{
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; font-size:12px; font-weight:600;
  }
  #dayAgendaPanel .search-result.multiday .sr-date{font-size:10px; width:auto;}
  .sr-courtesy{
    display:block; font-size:11px; color:var(--courtesy); margin-top:3px; font-weight:600;
  }
  .perf-actions{display:flex; gap:14px; margin-top:4px; flex-wrap:wrap;}

  .modal-search{max-width:560px;}
  .modal-search #searchInput{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line-solid);
    background:var(--panel-2); color:var(--text); font-family:inherit; font-size:14px; margin-bottom:14px;
  }
  .search-results{max-height:50vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px;}
  .search-hint{color:var(--text-dim); font-size:13px; padding:10px 2px;}
  .search-result{
    display:flex; gap:12px; align-items:flex-start; background:var(--panel-2);
    border:1px solid var(--line-solid); border-radius:10px; padding:10px 12px;
  }
  .sr-date{font-family:var(--mono); font-size:11px; color:var(--text-dim); width:72px; flex-shrink:0; padding-top:2px;}
  .sr-body{flex:1; min-width:0;}
  .sr-title{font-size:14px; font-weight:700;}
  .sr-phone{font-size:12px; color:var(--text-dim); font-family:var(--mono);}
  .sr-status{font-size:11px; color:var(--text-dim); flex-shrink:0; text-transform:uppercase; padding-top:2px;}
  .card.done .time{background:var(--done-dim);}

  .empty{padding:60px 20px; text-align:center; color:var(--text-dim);}
  .empty .big{font-size:15px; margin-bottom:6px; color:var(--text);}

  .setup{max-width:480px; margin:60px auto; padding:0 20px;}
  .setup h2{font-size:18px; margin-bottom:4px;}
  .setup p{color:var(--text-dim); font-size:13px; line-height:1.5;}
  .setup label{display:block; font-size:12px; color:var(--text-dim); margin:16px 0 6px;}
  .setup input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line-solid);
    background:var(--panel); color:var(--text); font-family:var(--mono); font-size:13px;
  }
  .setup .checkbox-row{
    display:flex; align-items:center; gap:8px; margin-top:18px; font-size:13px; color:var(--text-dim);
    cursor:pointer;
  }
  .setup .checkbox-row input{width:auto; padding:0;}
  .setup .primary{
    margin-top:22px; width:100%; padding:14px; border-radius:10px; border:none;
    background:var(--accent); color:#1a0d05; font-weight:700; font-size:14px; cursor:pointer;
  }
  .setup .origin{
    margin-top:18px; padding:12px 14px; background:var(--panel-2); border-radius:10px;
    font-family:var(--mono); font-size:12px; color:var(--text-dim); word-break:break-all;
  }
  .center-login{display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; gap:16px;}
  .center-login button{
    background:var(--accent); color:#1a0d05; border:none; padding:16px 28px; border-radius:12px;
    font-weight:700; font-size:15px; cursor:pointer;
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
// Le statut et le commentaire sont stockés en propriété privée invisible de l'événement
// (n'affecte jamais la couleur ni l'apparence de l'événement dans Google Agenda)
const STATUS_KEY = 'atelier_status';   // 'cours' | 'paused' | 'done' | absent
const COMMENT_KEY = 'atelier_comment';
const PERF_BEFORE_KEY = 'atelier_perf_before';
const PERF_AFTER_KEY = 'atelier_perf_after';
const PERF060_BEFORE_KEY = 'atelier_perf060_before';
const PERF060_AFTER_KEY = 'atelier_perf060_after';
const PERF_HP_BEFORE_KEY = 'atelier_perf_hp_before';
const PERF_HP_AFTER_KEY = 'atelier_perf_hp_after';
const PERF_TORQUE_BEFORE_KEY = 'atelier_perf_torque_before';
const PERF_TORQUE_AFTER_KEY = 'atelier_perf_torque_after';
const COURTESY_CAR_KEY = 'atelier_courtesy_car';
const COURTESY_CARS = { audi: 'Audi A4 (diesel)', twingo: 'Twingo (éthanol)', c3: 'C3 (diesel)' };

let chatMessages = [];

const PRESTATIONS_CATALOG = `
- Mise à jour de la vanne EGR : 180€ TTC, 30 min de travail actif, occupe une demi-journée de planning, jusqu'à 3 en simultané par demi-journée
- Mise à jour du FAP : 180€ TTC, ~30 min de travail actif, occupe une demi-journée, jusqu'à 3 en simultané par demi-journée
- Mise à jour AdBlue : 350€ TTC, ~30 min de travail actif, occupe une demi-journée, jusqu'à 3 en simultané par demi-journée
- Reprogrammation puissance, véhicule jusqu'à 2014 : 450€ TTC, 1h de travail actif, occupe une journée complète, jusqu'à 3 en simultané par jour
- Reprogrammation puissance, véhicule 2015 à 2019 : 500€ TTC, 1h de travail actif, occupe une journée complète, jusqu'à 3 en simultané par jour
- Reprogrammation puissance, véhicule 2020 à 2022 : 550€ TTC, 1h de travail actif, occupe une journée complète, jusqu'à 3 en simultané par jour
- Reprogrammation puissance, véhicule 2022 à aujourd'hui : 600€ TTC, 1h de travail actif, occupe une journée complète, jusqu'à 3 en simultané par jour
- Banc de puissance EN PLUS d'une reprog puissance (option, prix à additionner à la reprog) : +80€ TTC, +2 à 3h de travail actif en plus, jusqu'à 2 en simultané
- Banc de puissance seul (sans reprog) : 120€ TTC, 1h de travail actif, occupe 3h, jusqu'à 2 en simultané
- Contrôle du 5ème plein après conversion Flexfuel (suivi gratuit, à part) : 0€, 15 min de travail actif, occupe 30 min, 1 seul à la fois
- Flexfuel (passage éthanol E85), 3 ou 4 cylindres : 690€ TTC, 1h de travail actif, garde le véhicule 24h (contrôle démarrage à froid), jusqu'à 2 en simultané
- Flexfuel (passage éthanol E85), 5 cylindres : 790€ TTC, 1h de travail actif, garde le véhicule 24h, jusqu'à 2 en simultané
- Flexfuel (passage éthanol E85), 6 cylindres : 990€ TTC, 1h de travail actif, garde le véhicule 24h, jusqu'à 2 en simultané
- Flexfuel (passage éthanol E85), 8 ou 10 cylindres : 1190€ TTC, 1h de travail actif, garde le véhicule 24h, jusqu'à 2 en simultané
`.trim();

const BOOKING_TOOLS = [
  {
    name: "check_availability",
    description: "Renvoie, pour chaque jour de la plage demandée, le nombre de rendez-vous déjà pris et le chiffre d'affaires déjà engagé (TTC et HT estimés) — jamais les noms de clients, numéros ou détails des rendez-vous, qui restent confidentiels.",
    input_schema: {
      type: "object",
      properties: {
        date_debut: { type: "string", description: "Date de début au format AAAA-MM-JJ" },
        date_fin: { type: "string", description: "Date de fin au format AAAA-MM-JJ" }
      },
      required: ["date_debut", "date_fin"]
    }
  },
  {
    name: "create_appointment",
    description: "Crée le rendez-vous dans Google Agenda. À utiliser uniquement après confirmation explicite de l'utilisateur sur le véhicule, la date et l'heure.",
    input_schema: {
      type: "object",
      properties: {

function playChime(){
  if(config?.soundEnabled === false) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    const startAt = ctx.currentTime;

    // Alarme en rafale : 3 bips stridents montants-descendants, volume élevé
    for(let i = 0; i < 3; i++){
      const t0 = startAt + i * 0.26;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1100, t0);
      osc.frequency.exponentialRampToValueAtTime(1900, t0 + 0.09);
      osc.frequency.exponentialRampToValueAtTime(1100, t0 + 0.2);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.55, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.24);
    }
  }catch(e){}
}

}

// Récupère un jeton d'accès frais auprès du relais Cloudflare (aucune interaction utilisateur,
// aucune dépendance aux cookies du navigateur : fonctionne indéfiniment sans surveillance)
// fetch avec délai maximum, et une retentative silencieuse avant d'abandonner pour de bon
async function fetchWithTimeout(url, options = {}, timeoutMs = 20000, retriesLeft = 1){
  try{
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    const res = await fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
    return res;
  }catch(e){
    if(retriesLeft > 0){
      await new Promise(r => setTimeout(r, 1000)); // petite pause avant de retenter
      return fetchWithTimeout(url, options, timeoutMs, retriesLeft - 1);
    }
    throw e;
  }
}

async function getAccessToken(){
  try{
    const res = await fetchWithTimeout(config.workerUrl);
    if(!res.ok) throw new Error('relais indisponible');
    const data = await res.json();
    if(!data.access_token) throw new Error('réponse invalide');
    accessToken = data.access_token;
    connectionLost = false;
    if(tokenTimer) clearTimeout(tokenTimer);
    const delayMs = Math.max((data.expires_in - 300) * 1000, 30000);
    tokenTimer = setTimeout(getAccessToken, delayMs);
    return true;
  }catch(e){
    markConnectionLost();
    return false;
  }
}

// Requête authentifiée avec retentative automatique et unique si le jeton a expiré entre-temps
async function authFetch(url, options = {}, allowRetry = true){
  const opts = { ...options, headers: { ...(options.headers || {}), Authorization: `Bearer ${accessToken}` } };
  const res = await fetchWithTimeout(url, opts);
  if(res.status === 401 && allowRetry){
    const ok = await getAccessToken();
    if(ok) return authFetch(url, options, false);
  }
  return res;
}

function markConnectionLost(){
  connectionLost = true;
  renderList();
  if(retryTimer) clearTimeout(retryTimer);
  // nouvelle tentative automatique, sans aucune action requise
  retryTimer = setTimeout(async () => {
    const ok = await getAccessToken();
    if(ok) fetchEvents();
  }, 15000);
}

const DAYS_AHEAD = 3; // aujourd'hui + 2 jours

function windowRange(){
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0,0,0);
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + DAYS_AHEAD - 1, 23,59,59);
  return { timeMin: start.toISOString(), timeMax: end.toISOString(), start, end };
}

function dayKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function mapEvent(ev){
  const startRaw = ev.start?.dateTime || ev.start?.date;
  const endRaw = ev.end?.dateTime || ev.end?.date;
  const allDay = !ev.start?.dateTime;
  const startD = new Date(startRaw);
  // pour un événement "jour entier", la date de fin Google est exclusive : on retire 1 jour
  let endD = new Date(endRaw);
  if(allDay) endD = new Date(endD.getTime() - 24*3600*1000);
  const priv = ev.extendedProperties?.private || {};
  return {
    id: ev.id,
    start: startRaw,
    end: endRaw,
    startD, endD, allDay,
    raw: ev.summary || '',
    done: priv[STATUS_KEY] === 'done',
    paused: priv[STATUS_KEY] === 'paused',
    inProgress: priv[STATUS_KEY] === 'cours',
    comment: priv[COMMENT_KEY] || '',
    perfBefore: priv[PERF_BEFORE_KEY] || '',
    perfAfter: priv[PERF_AFTER_KEY] || '',
    perf060Before: priv[PERF060_BEFORE_KEY] || '',
    perf060After: priv[PERF060_AFTER_KEY] || '',
    hpBefore: priv[PERF_HP_BEFORE_KEY] || '',
    hpAfter: priv[PERF_HP_AFTER_KEY] || '',
    torqueBefore: priv[PERF_TORQUE_BEFORE_KEY] || '',
    torqueAfter: priv[PERF_TORQUE_AFTER_KEY] || '',
    courtesyCar: priv[COURTESY_CAR_KEY] || ''
  };
}

function decodeBase64Url(data){
  try{
    const base64 = (data || '').replace(/-/g, '+').replace(/_/g, '/');
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }catch(e){ return ''; }
}

function parseGmailMessage(msg){
  const headers = msg.payload?.headers || [];
  const getHeader = (name) => (headers.find(h => h.name.toLowerCase() === name.toLowerCase())?.value || '');
  const subject = getHeader('Subject');
  const from = getHeader('From');
  const fromEmail = ((from.match(/<(.+?)>/) || [null, from])[1] || '').trim().toLowerCase();

  let bodyText = '';
  const attachments = [];
  (function walk(part){
    if(!part) return;
    if(part.filename && part.body?.attachmentId){
      attachments.push({ attachmentId: part.body.attachmentId, filename: part.filename });
    } else if(part.mimeType === 'text/plain' && part.body?.data){
      bodyText += decodeBase64Url(part.body.data);
    }
    (part.parts || []).forEach(walk);
  })(msg.payload);

  return {
    subject,
    fromEmail,
    bodyText: bodyText.trim(),
    attachments,
    receivedAt: new Date(parseInt(msg.internalDate, 10) || Date.now()).toISOString()
  };
}

async function scanGmailForNewTasks(){
  if(!config.remoteWorkerUrl || !config.remoteAccessKey){
    console.warn('[dossiers à distance] scan Gmail ignoré : non configuré');
    return;
  }
  console.log('[dossiers à distance] scan Gmail en cours...');
  try{
    const fromQuery = REMOTE_SENDERS.map(e => `from:${e}`).join(' OR ');
    const q = encodeURIComponent(`(${fromQuery}) has:attachment newer_than:30d in:inbox`);
    const url = `https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${q}&maxResults=30`;
    const res = await authFetch(url);
    if(!res.ok){
      console.error('[dossiers à distance] recherche Gmail : réponse HTTP', res.status, await res.text().catch(()=>''));
      return;
    }
    const data = await res.json();
    const messages = data.messages || [];
    console.log('[dossiers à distance] mails trouvés correspondant aux critères :', messages.length);
    const existingIds = new Set(remoteTasks.map(t => t.id));
    const newOnes = messages.filter(m => !existingIds.has(m.id));
    console.log('[dossiers à distance] dont nouveaux (pas encore importés) :', newOnes.length);
    if(newOnes.length === 0) return;

    let addedAny = false;
    for(const m of newOnes){
      const msgRes = await authFetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${m.id}?format=full`);
      if(!msgRes.ok){
        console.error('[dossiers à distance] échec lecture du message', m.id, msgRes.status);
        continue;
      }
      const msg = await msgRes.json();
      const parsed = parseGmailMessage(msg);
      if(parsed.attachments.length === 0){
        console.log('[dossiers à distance] message', m.id, 'ignoré : aucune pièce jointe détectée dans le contenu');
        continue;
      }
      const primaryFile = parsed.attachments.find(a => /\.(mmf|zip)$/i.test(a.filename)) || parsed.attachments[0];
      remoteTasks.push({
        id: m.id,
        from: parsed.fromEmail,
        subject: parsed.subject,
        body: parsed.bodyText,
        receivedAt: parsed.receivedAt,
        attachments: parsed.attachments,
        tool: detectTool(primaryFile.filename),
        status: '',
        comment: ''
      });
      addedAny = true;
      console.log('[dossiers à distance] fiche ajoutée :', parsed.subject);
    }
    if(addedAny){
      remoteTasks.sort((a, b) => new Date(b.receivedAt) - new Date(a.receivedAt));
      await saveRemoteTasksToServer();
      playChime();
      renderList();
    }
  }catch(e){
    console.error('[dossiers à distance] scanGmailForNewTasks a échoué :', e);
  }
}

async function downloadGmailAttachment(messageId, attachmentId, filename){
  try{
    const url = `https://gmail.googleapis.com/gmail/v1/users/me/messages/${messageId}/attachments/${attachmentId}`;
    const res = await authFetch(url);
    if(!res.ok){ alert("Impossible de récupérer le fichier pour le moment."); return; }
    const data = await res.json();
    const base64 = (data.data || '').replace(/-/g, '+').replace(/_/g, '/');
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'application/octet-stream' });
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename || 'fichier';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
  }catch(e){
    alert("Impossible de récupérer le fichier pour le moment.");
  }
}

async function fetchEvents(){
  const { timeMin, timeMax } = windowRange();
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(config.calendarId)}/events?singleEvents=true&orderBy=startTime&timeMin=${timeMin}&timeMax=${timeMax}`;
  const res = await authFetch(url);
  if(!res.ok){ markConnectionLost(); return; }
  const data = await res.json();
  events = (data.items || []).map(mapEvent);

  const newSnapshot = computeSnapshot(events);
  if(previousSnapshot !== null && newSnapshot !== previousSnapshot){
    playChime();
  }
  previousSnapshot = newSnapshot;

  renderList();
}

async function createCalendarEvent({nom, voiture, presta, numero, commentaire, courtesy, date, startTime, endTime, isMultiDay, endDate}){
  const modelPart = [nom, voiture].filter(Boolean).join(' ').trim();
  let summary = [modelPart, presta, numero].filter(Boolean).join(' | ');
  if(courtesy) summary += ` 🚗 ${COURTESY_CARS[courtesy]}`;
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(config.calendarId)}/events`;

  let body;
  if(isMultiDay){
    // Google Agenda attend une date de fin exclusive : on ajoute 1 jour au dernier jour choisi
    const endExclusive = new Date(endDate + 'T00:00:00');
    endExclusive.setDate(endExclusive.getDate() + 1);
    const endExclusiveStr = `${endExclusive.getFullYear()}-${String(endExclusive.getMonth()+1).padStart(2,'0')}-${String(endExclusive.getDate()).padStart(2,'0')}`;
    body = {
      summary,
      start: { date: date },
      end: { date: endExclusiveStr }
    };
  } else {
    body = {
      summary,
      start: { dateTime: `${date}T${startTime}:00`, timeZone: 'Europe/Paris' },
      end: { dateTime: `${date}T${endTime}:00`, timeZone: 'Europe/Paris' }
    };
  }

  const res = await authFetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    alert("Impossible de créer le rendez-vous. Réessaie dans quelques instants.");
    return false;
  }
  const created = await res.json();
  if(commentaire || courtesy){
    await patchPrivateProps(created.id, { [COMMENT_KEY]: commentaire || '', [COURTESY_CAR_KEY]: courtesy || '' }, courtesy ? '6' : undefined);
  }
  return true;
}

// Estimation du prix (TTC) d'une prestation à partir de mots-clés dans le titre — fait ici en code,
// jamais par l'assistant, pour ne jamais avoir à lui transmettre le titre brut (qui contient nom/téléphone/détails)
const REVENUE_KEYWORDS = [
  { keywords: ['egr'], priceTTC: 180 },
  { keywords: ['fap'], priceTTC: 180 },
  { keywords: ['adblue'], priceTTC: 350 },
  { keywords: ['flexfuel', 'ethanol', 'éthanol', 'e85'], priceTTC: 690 },
  { keywords: ['banc'], priceTTC: 120 },
  { keywords: ['puissance', 'reprog'], priceTTC: 500 }
];
function estimateRevenueTTC(title){
  const t = (title || '').toLowerCase();

  // 1. Cherche d'abord un montant écrit noir sur blanc dans le titre (plus fiable qu'une estimation par mot-clé)
  const priceMatch = t.match(/(\d{2,5})(?:[.,](\d{1,2}))?\s*(?:€|eur|euros?)\b/);
  if(priceMatch){
    const entier = parseInt(priceMatch[1], 10);
    const decimales = priceMatch[2] ? parseInt(priceMatch[2], 10) / 100 : 0;
    return entier + decimales;
  }

  // 2. Sinon, essaie de reconnaître la prestation par mot-clé dans le catalogue
  for(const entry of REVENUE_KEYWORDS){
    if(entry.keywords.some(k => t.includes(k))) return entry.priceTTC;
  }
  return 0;
}

async function executeTool(toolName, input){
  if(toolName === 'check_availability'){
    try{
      const timeMin = new Date(input.date_debut + 'T00:00:00').toISOString();
      const timeMax = new Date(input.date_fin + 'T23:59:59').toISOString();
      const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(config.calendarId)}/events?singleEvents=true&orderBy=startTime&timeMin=${timeMin}&timeMax=${timeMax}&maxResults=250`;
      const res = await authFetch(url);
      if(!res.ok) return { error: "Impossible de consulter l'agenda." };
      const data = await res.json();

      // Une entrée pour CHAQUE jour de la plage (même totalement libre), pour que jour_semaine soit toujours fiable
      const parJour = {};
      let d = new Date(input.date_debut + 'T12:00:00');
      const fin = new Date(input.date_fin + 'T12:00:00');
      while(d <= fin){
        const dateKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        parJour[dateKey] = {
          date: dateKey,
          jour_semaine: d.toLocaleDateString('fr-FR', {weekday: 'long'}),
          date_affichage: d.toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'}),
          nombre_rdv: 0,
          chiffre_affaires_ttc_estime: 0
        };
        d.setDate(d.getDate() + 1);
      }

      (data.items || []).forEach(ev => {
        const startRaw = ev.start?.dateTime || ev.start?.date;
        const endRaw = ev.end?.dateTime || ev.end?.date;
        const allDay = !ev.start?.dateTime;
        const dateKey = (startRaw || '').slice(0, 10);
        if(!dateKey) return;

        // Un rendez-vous type Flexfuel garde le véhicule 24h (sur 2 jours calendaires) même si le
        // travail actif ne dure qu'environ 1h le jour du dépôt : on compte sa présence (nombre_rdv,
        // donc une place de garde prise) sur CHAQUE jour couvert, pas seulement le jour de début —
        // c'est la durée de garde qui détermine la disponibilité, pas le temps d'intervention. Le
        // chiffre d'affaires, lui, n'est compté qu'une fois, le jour du dépôt, pour ne pas fausser
        // l'objectif de CA journalier avec un même montant compté deux fois.
        const isMultiDayEvent = allDay && endRaw && startRaw && (new Date(endRaw) - new Date(startRaw)) > 24 * 3600 * 1000;
        if(isMultiDayEvent){
          let d = new Date(startRaw + 'T00:00:00');
          const endD = new Date(endRaw); // borne exclusive
          while(d < endD){
            const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            if(parJour[key]) parJour[key].nombre_rdv += 1;
            d.setDate(d.getDate() + 1);
          }
          if(parJour[dateKey]) parJour[dateKey].chiffre_affaires_ttc_estime += estimateRevenueTTC(ev.summary);
        } else {
          if(!parJour[dateKey]) return;
          parJour[dateKey].nombre_rdv += 1;
          parJour[dateKey].chiffre_affaires_ttc_estime += estimateRevenueTTC(ev.summary);
        }
      });

      const jours = Object.values(parJour).map(j => ({
        date: j.date,
        jour_semaine: j.jour_semaine,
        date_affichage: j.date_affichage,
        nombre_rdv: j.nombre_rdv,
        chiffre_affaires_ttc_estime: j.chiffre_affaires_ttc_estime,
        chiffre_affaires_ht_estime: Math.round(j.chiffre_affaires_ttc_estime / 1.2)
      })).sort((a, b) => a.date.localeCompare(b.date));

      return { jours }; // aucune donnée brute (ni nom, ni téléphone, ni titre) n'est jamais incluse ici — jour_semaine est toujours calculé ici, jamais à deviner
    }catch(e){
      return { error: "Erreur lors de la consultation de l'agenda." };
    }
  }
  if(toolName === 'create_appointment'){
    // Flexfuel garde le véhicule 24h (contrôle du démarrage à froid) : le rendez-vous doit occuper
    // 2 jours calendaires même si le travail actif ne dure qu'environ 1h le jour du dépôt — la garde,
    // pas le temps d'intervention, détermine la place prise. On le détecte automatiquement plutôt que
    // de laisser le modèle calculer une date de fin lui-même.
    const prestaLower = (input.presta || '').toLowerCase();
    const isFlexfuel = /flexfuel|ethanol|éthanol|e85/.test(prestaLower);
    let commentaire = input.commentaire || '';
    let isMultiDay = false, endDate = '';
    if(isFlexfuel){
      isMultiDay = true;
      const fin = new Date(input.date + 'T00:00:00');
      fin.setDate(fin.getDate() + 1);
      endDate = `${fin.getFullYear()}-${String(fin.getMonth() + 1).padStart(2, '0')}-${String(fin.getDate()).padStart(2, '0')}`;
      if(input.heure_debut) commentaire = `Dépôt véhicule vers ${input.heure_debut}.${commentaire ? ' ' + commentaire : ''}`;
    }
    const ok = await createCalendarEvent({
      nom: input.nom || '', voiture: input.voiture || '', presta: input.presta || '',
      numero: input.numero || '', commentaire, courtesy: '',
      date: input.date, startTime: input.heure_debut, endTime: input.heure_fin,
      isMultiDay, endDate
    });
    return ok ? { succes: true, message: "Rendez-vous créé avec succès." } : { succes: false, message: "Échec de la création du rendez-vous." };
  }
  return { error: "Outil inconnu." };
}

    messages: chatMessages,

  try{

async function handleUserMessage(text){
  addChatBubble('user', text);
  chatMessages.push({ role: 'user', content: text });
  await runAssistantTurn(0);
}

async function runAssistantTurn(turnCount = 0){
  if(turnCount >= 2){
    addChatInfo("Je n'arrive pas à conclure automatiquement — contacte-nous directement au 07 69 37 70 92 pour ton rendez-vous.");
    return;
  }
  const loadingBubble = addChatInfo('...réflexion...');
  const data = await callAssistant();
  if(loadingBubble) loadingBubble.remove();

  if(!data || !data.content){
    addChatInfo("L'assistant est momentanément indisponible, réessaie dans un instant.");
    return;
  }

  chatMessages.push({ role: 'assistant', content: data.content });

  data.content.filter(b => b.type === 'text').forEach(b => addChatBubble('assistant', b.text));

  const toolUses = data.content.filter(b => b.type === 'tool_use');
  if(toolUses.length > 0){
    if(toolUses.some(tu => tu.name === 'create_appointment')) addChatInfo('📅 Création du rendez-vous...');
    if(toolUses.some(tu => tu.name === 'check_availability')) addChatInfo('🔍 Vérification de l\'agenda...');
    const results = await Promise.all(toolUses.map(tu => executeTool(tu.name, tu.input)));
    const toolResults = toolUses.map((tu, i) => ({ type: 'tool_result', tool_use_id: tu.id, content: JSON.stringify(results[i]) }));
    if(toolUses.some((tu, i) => tu.name === 'create_appointment' && results[i].succes)) fetchEvents();
    chatMessages.push({ role: 'user', content: toolResults });
    await runAssistantTurn(turnCount + 1);
  }
}

        <button type="button" class="mc-nav" id="mcPrev" ${dayOffset <= 0 ? 'disabled' : ''}>‹</button>
        <span class="mc-title">${rangeLabel}</span>
        <button type="button" class="mc-nav" id="mcNext">›</button>
      </div>
      <div class="mc-weekdays"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="mc-grid">${cells}</div>
    `;
    document.getElementById('mcPrev').onclick = () => { if(dayOffset > 0){ dayOffset--; renderMiniCal(); renderMonthSummary(); } };
    document.getElementById('mcNext').onclick = () => { dayOffset++; renderMiniCal(); renderMonthSummary(); };
    document.querySelectorAll('.mc-cell:not(.mc-empty)').forEach(el => {
      el.onclick = () => {
        selectedDate = el.dataset.date;
        document.getElementById('newDate').value = selectedDate;
        renderMiniCal();
        renderDayAgenda();
      };
    });
  }

  function renderDayAgenda(){
    const panel = document.getElementById('dayAgendaPanel');
    if(!panel) return;
    const selD = new Date(selectedDate + 'T00:00:00');
    const dayEvents = allUpcomingEvents
      .filter(ev => {
        if(ev.isMultiDay){
          const startD = new Date(ev.start + 'T00:00:00');
          const endD = new Date(ev.end); // borne exclusive
          return selD >= startD && selD < endD;
        }
        return ev.dateStr === selectedDate;
      })
      .sort((a, b) => (a.start || '').localeCompare(b.start || ''));
    const dateLabel = new Date(selectedDate + 'T00:00:00').toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});

    if(dayEvents.length === 0){
      panel.innerHTML = `<div class="day-agenda-title">${dateLabel}</div><div class="search-hint">Aucun rendez-vous ce jour — journée libre.</div>`;
      return;
    }
    panel.innerHTML = `
      <div class="day-agenda-title">${dateLabel} — ${dayEvents.length} RDV déjà pris</div>
      ${dayEvents.map(ev => {
        const parts = parseParts(ev.raw);
        const label = parts ? `${parts.model} — ${parts.presta}` : ev.raw;
        const timeLabel = ev.allDay ? (ev.isMultiDay ? 'Plsrs jours' : 'Jour entier') : `${fmtTime(ev.start)} → ${fmtTime(ev.end)}`;
        const courtesyTag = ev.courtesyCar ? `<span class="sr-courtesy">🚗 ${escapeHtml(COURTESY_CARS[ev.courtesyCar] || ev.courtesyCar)}</span>` : '';
        return `
          <div class="search-result ${ev.isMultiDay ? 'multiday' : ''}">
            <div class="sr-date">${timeLabel}</div>
            <div class="sr-body"><div class="sr-title">${escapeHtml(label)}</div>${courtesyTag}</div>
          </div>
        `;
      }).join('')}
    `;
  }

  document.getElementById('newDate').addEventListener('change', (e) => {
    selectedDate = e.target.value;
    renderMiniCal();
    renderDayAgenda();
    const endDateInput = document.getElementById('newEndDate');
    if(endDateInput){
      endDateInput.min = e.target.value;
      if(endDateInput.value < e.target.value) endDateInput.value = e.target.value;
    }
  });

  document.getElementById('newMultiDay').addEventListener('change', (e) => {
    document.getElementById('singleDayFields').style.display = e.target.checked ? 'none' : '';
    document.getElementById('multiDayFields').style.display = e.target.checked ? '' : 'none';
  });

  renderMiniCal();
  renderDayAgenda();

  // Charge les rendez-vous des 3 prochains mois : compte par jour + détail pour le jour sélectionné
  try{
    const timeMin = now.toISOString();
    const timeMax = new Date(now.getFullYear(), now.getMonth() + 3, now.getDate()).toISOString();
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(config.calendarId)}/events?singleEvents=true&orderBy=startTime&maxResults=2500&timeMin=${timeMin}&timeMax=${timeMax}`;
    const res = await authFetch(url);
    if(res.ok){
      const data = await res.json();
      allUpcomingEvents = (data.items || []).map(ev => {
        const startRaw = ev.start?.dateTime || ev.start?.date;
        const endRaw = ev.end?.dateTime || ev.end?.date;
        const allDay = !ev.start?.dateTime;
        const isMultiDay = allDay && endRaw && startRaw && (new Date(endRaw) - new Date(startRaw)) > 24 * 3600 * 1000;
        return {
          id: ev.id,
          start: startRaw,
          end: endRaw,
          allDay,
          isMultiDay,
          raw: ev.summary || '',
          dateStr: (startRaw || '').slice(0, 10),
          courtesyCar: ev.extendedProperties?.private?.[COURTESY_CAR_KEY] || ''
        };
      });
      countsByDate = {};
      allUpcomingEvents.forEach(ev => {
        if(ev.isMultiDay){
          let d = new Date(ev.start + 'T00:00:00');
          const endD = new Date(ev.end);
          while(d < endD){
            const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            countsByDate[key] = (countsByDate[key] || 0) + 1;
            d.setDate(d.getDate() + 1);
          }
        } else {
          countsByDate[ev.dateStr] = (countsByDate[ev.dateStr] || 0) + 1;
        }
      });
    }
  }catch(e){}
  const loadingEl = document.getElementById('mcLoading');
  if(loadingEl) loadingEl.remove();
  renderMiniCal();
  renderMonthSummary();
  renderDayAgenda();

  document.getElementById('saveNewEvent').onclick = async () => {
    const nom = document.getElementById('newNom').value.trim();
    const voiture = document.getElementById('newVoiture').value.trim();
    const presta = document.getElementById('newPresta').value.trim();
    const numero = document.getElementById('newNumero').value.trim();
    const commentaire = document.getElementById('newComment').value.trim();
    const courtesy = document.getElementById('newCourtesy').value;
    const date = document.getElementById('newDate').value;
    const isMultiDay = document.getElementById('newMultiDay').checked;
    const startTime = document.getElementById('newStartTime').value;
    const endTime = document.getElementById('newEndTime').value;
    const endDate = document.getElementById('newEndDate').value;
    if(!nom || !voiture || !date){
      alert('Renseigne au moins le nom, la voiture et la date.');
      return;
    }
    if(isMultiDay && !endDate){
      alert('Renseigne le dernier jour de garde du véhicule.');
      return;
    }
    if(!isMultiDay && (!startTime || !endTime)){
      alert('Renseigne les horaires de début et de fin.');
      return;
    }
    const saveBtn = document.getElementById('saveNewEvent');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Création...';
    const ok = await createCalendarEvent({nom, voiture, presta, numero, commentaire, courtesy, date, startTime, endTime, isMultiDay, endDate});
    if(ok){
      overlay.remove();
      fetchEvents();
    } else {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Créer';
    }
  };
}

function printPerfReport(ev){
  const before = ev.perfBefore || '';
  const after = ev.perfAfter || '';
  const before060 = ev.perf060Before || '';
  const after060 = ev.perf060After || '';
  const gainOf = (b, a) => {
    const bn = parseFloat((b || '').replace(',', '.'));
    const an = parseFloat((a || '').replace(',', '.'));
    return (!isNaN(bn) && !isNaN(an)) ? `${(bn - an).toFixed(2)} s` : '—';
  };
  const gainPlusOf = (b, a, unit) => {
    const bn = parseFloat((b || '').replace(',', '.'));
    const an = parseFloat((a || '').replace(',', '.'));
    return (!isNaN(bn) && !isNaN(an)) ? `+${(an - bn).toFixed(0)} ${unit}` : '—';
  };
  const dateStr = new Date().toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});

  const rows060 = (before060 || after060) ? `
    <tr><td class="label">0-60 km/h d'origine</td><td>${escapeHtml(before060 || '—')}</td></tr>
    <tr><td class="label">0-60 km/h après reprogrammation</td><td>${escapeHtml(after060 || '—')}</td></tr>
    <tr class="gain-row"><td class="label">Gain 0-60</td><td>${gainOf(before060, after060)}</td></tr>
  ` : '';

  const rowsPower = (ev.hpBefore || ev.hpAfter || ev.torqueBefore || ev.torqueAfter) ? `
    <tr><td class="label">Puissance d'origine (approx.)</td><td>${escapeHtml(ev.hpBefore || '—')} ch</td></tr>
    <tr><td class="label">Puissance après reprogrammation (approx.)</td><td>${escapeHtml(ev.hpAfter || '—')} ch</td></tr>
    <tr class="gain-row"><td class="label">Gain puissance</td><td>${gainPlusOf(ev.hpBefore, ev.hpAfter, 'ch')}</td></tr>
    <tr><td class="label">Couple d'origine (approx.)</td><td>${escapeHtml(ev.torqueBefore || '—')} Nm</td></tr>
    <tr><td class="label">Couple après reprogrammation (approx.)</td><td>${escapeHtml(ev.torqueAfter || '—')} Nm</td></tr>
    <tr class="gain-row"><td class="label">Gain couple</td><td>${gainPlusOf(ev.torqueBefore, ev.torqueAfter, 'Nm')}</td></tr>
  ` : '';

  const html = `<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rapport de performance</title>
<style>
  body{ font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; padding:40px; color:#1a1a1a; max-width:650px; margin:0 auto; }
  h1{ font-size:21px; margin:0 0 4px; }
  .sub{ color:#666; font-size:13px; margin-bottom:32px; }
  table{ width:100%; border-collapse:collapse; margin-top:10px; }
  td{ padding:14px 16px; border:1px solid #ddd; font-size:15px; }
  td.label{ background:#f4f4f4; font-weight:600; width:50%; }
  tr.gain-row td{ background:#ff6a2b; color:#fff; font-weight:700; }
  tr.gain-row td.label{ background:#e55a1c; }
  .brand{ font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:#ff6a2b; font-weight:700; margin-bottom:8px; }
  .footer{ margin-top:36px; font-size:11px; color:#999; line-height:1.5; }
  @media print{ body{ padding:15px; } tr.gain-row td{ -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
</style>
</head>
<body>
  <div class="brand">AG Sport Reprog</div>
  <h1>Rapport de performance — Augmentation de puissance</h1>
  <div class="sub">Édité le ${dateStr}</div>
  <table>
    ${rows060}
    <tr><td class="label">0-100 km/h d'origine</td><td>${escapeHtml(before || '—')}</td></tr>
    <tr><td class="label">0-100 km/h après reprogrammation</td><td>${escapeHtml(after || '—')}</td></tr>
    <tr class="gain-row"><td class="label">Gain 0-100</td><td>${gainOf(before, after)}</td></tr>
    ${rowsPower}
  </table>
  <div class="footer">Mesures effectuées à l'aide d'un récepteur GPS (Dragy ou équivalent). Valeurs de puissance et couple approximatives (estimation atelier, non certifiées banc de puissance). Résultats donnés à titre indicatif, pouvant varier selon les conditions (météo, revêtement, charge du véhicule).</div>
  <script>window.onload = () => window.print();<\/script>
</body>

  const w = window.open('', '_blank');
  if(w){

    w.document.close();

function parseParts(raw){
  const cleaned = (raw || '').replace(/ 🚗 .+$/, '');
  const parts = cleaned.split('|').map(s => s.trim()).filter(Boolean);
  if(parts.length >= 2){
    return { model: parts[0], presta: parts[1] || '', phone: parts[2] || '' };
  }
  return null;
}

function fmtTime(dtStr){
  if(!dtStr) return '--:--';
  if(dtStr.length === 10) return 'Jour';
  const d = new Date(dtStr);
  return d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}

function fmtRange(ev){
  if(ev.allDay) return 'Jour';
  const start = fmtTime(ev.start);
  const end = fmtTime(ev.end);
  return `${start}<span class="arrow">→</span>${end}`;
}

function renderList(){
  const activeEvents = events.filter(e => !e.paused);
  const doneCount = activeEvents.filter(e => e.done).length;
  const pausedCount = events.filter(e => e.paused).length;
  const today = new Date();
  const todayKey = dayKey(today);
  const headerDate = today.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});

  // construit les DAYS_AHEAD jours de la fenêtre
  const days = [];
  for(let i = 0; i < DAYS_AHEAD; i++){
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
    days.push(d);
  }

  let listHtml = '';
  days.forEach(d => {
    const key = dayKey(d);
    const dEnd = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23,59,59);
    // un événement apparaît ce jour-là s'il couvre ce jour (gère les véhicules gardés plusieurs jours)
    const dayEvents = events
      .filter(ev => ev.startD <= dEnd && ev.endD >= d)
      .sort((a, b) => a.startD - b.startD);

    const isToday = key === todayKey;
    const label = isToday ? "Aujourd'hui" : d.toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});

    // les véhicules "en pause" ne comptent pas dans les compteurs
    const countedEvents = dayEvents.filter(ev => !ev.paused);

    let cardsHtml;
    if(dayEvents.length === 0){
      cardsHtml = `<div class="empty" style="padding:24px 20px"><div class="big">Rien de prévu</div></div>`;
    } else {
      cardsHtml = dayEvents.map(ev => {
        const parts = parseParts(ev.raw);
        const spansMultiple = dayKey(ev.startD) !== dayKey(ev.endD);
        const body = parts
          ? `<div class="model">${escapeHtml(parts.model)}</div>
             <div class="presta">${escapeHtml(parts.presta)}</div>
             ${parts.phone ? `<div class="phone">${escapeHtml(parts.phone)}</div>` : ''}
             ${spansMultiple ? `<div class="multiday-tag">Véhicule gardé plusieurs jours</div>` : ''}`
          : `<div class="raw">${escapeHtml(ev.raw)}</div>
             ${spansMultiple ? `<div class="multiday-tag">Véhicule gardé plusieurs jours</div>` : ''}`;
        const statusLabel = ev.done ? 'FAIT' : (ev.paused ? 'EN PAUSE' : (ev.inProgress ? 'EN COURS' : 'PRÉVU'));
        const commentHtml = ev.comment
          ? `<div class="comment-text">"${escapeHtml(ev.comment)}"</div>`
          : '';
        const hasPerf = ev.perfBefore || ev.perfAfter || ev.perf060Before || ev.perf060After || ev.hpBefore || ev.hpAfter || ev.torqueBefore || ev.torqueAfter;
        const perfLines = [];
        if(ev.perf060Before || ev.perf060After) perfLines.push(`0-60 : ${escapeHtml(ev.perf060Before || '—')} → ${escapeHtml(ev.perf060After || '—')}`);
        if(ev.perfBefore || ev.perfAfter) perfLines.push(`0-100 : ${escapeHtml(ev.perfBefore || '—')} → ${escapeHtml(ev.perfAfter || '—')}`);
        if(ev.hpBefore || ev.hpAfter) perfLines.push(`🐎 ${escapeHtml(ev.hpBefore || '—')} → ${escapeHtml(ev.hpAfter || '—')} ch`);
        if(ev.torqueBefore || ev.torqueAfter) perfLines.push(`Couple ${escapeHtml(ev.torqueBefore || '—')} → ${escapeHtml(ev.torqueAfter || '—')} Nm`);
        const perfData = encodeURIComponent(JSON.stringify({
          before: ev.perfBefore, after: ev.perfAfter, before060: ev.perf060Before, after060: ev.perf060After,
          hpBefore: ev.hpBefore, hpAfter: ev.hpAfter, torqueBefore: ev.torqueBefore, torqueAfter: ev.torqueAfter
        }));
        const perfHtml = `
          ${hasPerf ? `<div class="perf-summary">⏱ ${perfLines.join(' · ')}</div>` : ''}
          <div class="perf-actions">
            <div class="comment-btn perf-edit-btn" data-id="${ev.id}" data-perf="${perfData}">
              ${hasPerf ? '⏱ Modifier les performances' : '⏱ Ajouter les performances'}
            </div>
            ${hasPerf ? `<div class="comment-btn perf-print-btn" data-id="${ev.id}">🖨️ Imprimer PDF</div>` : ''}
          </div>
        `;
        const courtesyHtml = ev.courtesyCar ? `<div class="courtesy-badge">🚗 Courtoisie : ${escapeHtml(COURTESY_CARS[ev.courtesyCar] || ev.courtesyCar)}</div>` : '';
        return `
          <div class="card ${ev.done ? 'done' : ''} ${ev.paused ? 'paused' : ''} ${ev.inProgress ? 'inprogress' : ''} ${ev.courtesyCar ? 'has-courtesy' : ''}">
            <div class="card-top">
              <div class="time">${fmtRange(ev)}<span>${statusLabel}</span></div>
              <div class="body">
                ${body}
                ${commentHtml}
                <div class="comment-btn" data-id="${ev.id}" data-comment="${encodeURIComponent(ev.comment)}">
                  ${ev.comment ? '✎ Modifier le commentaire' : '+ Ajouter un commentaire'}
                </div>
                ${perfHtml}
                ${courtesyHtml}
                <div class="comment-btn courtesy-edit-btn" data-id="${ev.id}" data-current="${encodeURIComponent(ev.courtesyCar || '')}">
                  ${ev.courtesyCar ? '🚗 Modifier le véhicule de courtoisie' : '🚗 Prêter un véhicule de courtoisie'}
                </div>
              </div>
            </div>
            <div class="card-actions">
              <button class="action-btn cours-btn ${ev.inProgress ? 'on' : ''}" data-id="${ev.id}" data-active="${ev.inProgress}">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5v14l11-7z"/></svg>
                En cours
              </button>
              <button class="action-btn pause-btn ${ev.paused ? 'on' : ''}" data-id="${ev.id}" data-active="${ev.paused}">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
                Pause
              </button>
              <button class="action-btn done-btn ${ev.done ? 'on' : ''}" data-id="${ev.id}" data-active="${ev.done}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 7"/></svg>
                Fait
              </button>
            </div>
          </div>`;
      }).join('');
    }

    listHtml += `
      <div class="day-header">
        <div class="label">${label}</div>
        ${isToday ? '<div class="today-tag">Aujourd\'hui</div>' : ''}
        <div class="count">${countedEvents.length} véhicule${countedEvents.length > 1 ? 's' : ''}</div>
      </div>
      ${cardsHtml}
    `;
  });

  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="dot"></div>
        <div>
          <h1>Atelier · Planning</h1>
          <div class="date">${headerDate}</div>
        </div>
      </div>
      <div class="suite-tabs">
        <a href="./" class="tab-link active">📅 Planning</a>
        <a href="stock-calculateurs.html" class="tab-link">📦 Stock</a>
      </div>
      <div class="status">
        ${connectionLost
          ? `<button id="reconnectBtn" class="reconnect-btn"><span class="led lost"></span>Relais indisponible · nouvelle tentative automatique...</button>`
          : `<div class="led live"></div>Synchronisé`
        }
        <button id="searchBtn">🔍 Rechercher</button>
        <button id="newEventBtn">+ Nouveau RDV</button>
        <button id="assistantBtn">💬 Assistant IA</button>
        <button id="refreshBtn">↻ Actualiser</button>
        <button id="scanMailBtn">📧 Vérifier les mails</button>
        <button id="settingsBtn">⚙</button>
      </div>
    </div>
    <div class="counts">
      <div class="pill"><b>${activeEvents.length}</b> véhicules (3 jours)</div>
      <div class="pill"><b>${doneCount}</b> terminés</div>
      <div class="pill"><b>${activeEvents.length - doneCount}</b> restants</div>
      ${pausedCount > 0 ? `<div class="pill"><b>${pausedCount}</b> en pause</div>` : ''}
    </div>
    <div class="list">${renderRemoteTasksHtml()}${listHtml}</div>
  `;

  if(connectionLost){
    document.getElementById('reconnectBtn').onclick = async () => {
      const ok = await getAccessToken();
      if(ok) fetchEvents();
    };
  }
  document.getElementById('refreshBtn').onclick = fetchEvents;
  document.getElementById('scanMailBtn').onclick = () => {
    console.log('[dossiers à distance] vérification manuelle déclenchée');
    scanGmailForNewTasks();
  };
  document.getElementById('searchBtn').onclick = openSearchModal;
  document.getElementById('newEventBtn').onclick = openNewEventModal;
  document.getElementById('assistantBtn').onclick = openAssistantModal;
  document.getElementById('settingsBtn').onclick = renderSetup;
  document.querySelectorAll('.cours-btn').forEach(el => {
    el.onclick = () => {
      if(el.dataset.kind === 'remote') setRemoteStatus(el.dataset.id, el.dataset.active !== 'true' ? 'cours' : '');
      else setStatus(el.dataset.id, el.dataset.active !== 'true' ? 'cours' : '');
    };
  });
  document.querySelectorAll('.pause-btn').forEach(el => {
    el.onclick = () => {
      if(el.dataset.kind === 'remote') setRemoteStatus(el.dataset.id, el.dataset.active !== 'true' ? 'paused' : '');
      else setStatus(el.dataset.id, el.dataset.active !== 'true' ? 'paused' : '');
    };
  });
  document.querySelectorAll('.done-btn').forEach(el => {
    el.onclick = () => {
      if(el.dataset.kind === 'remote') setRemoteStatus(el.dataset.id, 'done');
      else setStatus(el.dataset.id, el.dataset.active !== 'true' ? 'done' : '');
    };
  });
  document.querySelectorAll('.comment-btn').forEach(el => {
    el.onclick = () => openCommentModal(el.dataset.id, decodeURIComponent(el.dataset.comment), el.dataset.kind === 'remote' ? 'remote' : 'event');
  });
  document.querySelectorAll('.attachment-link').forEach(el => {
    el.onclick = () => downloadGmailAttachment(el.dataset.msgid, el.dataset.attid, el.dataset.filename);
  });
  document.querySelectorAll('.reply-btn').forEach(el => {
    el.onclick = () => {
      const url = `https://mail.google.com/mail/?view=cm&fs=1&to=${el.dataset.to}&su=${el.dataset.subject}`;
      window.open(url, '_blank');
    };
  });
  document.querySelectorAll('.perf-edit-btn').forEach(el => {
    el.onclick = () => openPerfModal(el.dataset.id, JSON.parse(decodeURIComponent(el.dataset.perf)));
  });
  document.querySelectorAll('.perf-print-btn').forEach(el => {
    el.onclick = () => {
      const ev = events.find(e => e.id === el.dataset.id);
      if(ev) printPerfReport(ev);
    };
  });
  document.querySelectorAll('.courtesy-edit-btn').forEach(el => {
    el.onclick = () => openCourtesyModal(el.dataset.id, decodeURIComponent(el.dataset.current));
  });
}

function setupVoiceInput(button, textarea){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    button.style.display = 'none'; // non pris en charge par ce navigateur
    return;
  }
  let recognition = null;
  let listening = false;

  button.onclick = () => {
    if(listening){
      recognition.stop();
      return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = 'fr-FR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      button.classList.add('listening');
    };
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      const sep = textarea.value.trim() ? ' ' : '';
      textarea.value = textarea.value.trim() + sep + transcript;
      textarea.focus();
    };
    recognition.onerror = () => {
      listening = false;
      button.classList.remove('listening');
    };
    recognition.onend = () => {
      listening = false;
      button.classList.remove('listening');
    };
    recognition.start();
  };
}

function openCommentModal(id, currentComment, kind = 'event'){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal">
      <h3>Commentaire sur ${kind === 'remote' ? 'ce dossier' : 'ce rendez-vous'}</h3>
      <div class="textarea-wrap">
        <textarea id="commentInput" placeholder="Ex : plaquettes changées, prévoir contrôle dans 15 jours...">${escapeHtml(currentComment || '')}</textarea>
        <button type="button" id="voiceBtn" class="voice-btn" title="Dictée vocale">🎤</button>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelComment">Annuler</button>
        <button class="btn-save" id="saveComment">Enregistrer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('cancelComment').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  document.getElementById('saveComment').onclick = () => {
    const val = document.getElementById('commentInput').value.trim();
    overlay.remove();
    if(kind === 'remote') setRemoteComment(id, val);
    else setComment(id, val);
  };
  setupVoiceInput(document.getElementById('voiceBtn'), document.getElementById('commentInput'));
}

function openSearchModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal modal-search">
      <h3>Rechercher un véhicule</h3>
      <input type="text" id="searchInput" placeholder="Modèle, nom, téléphone...">
      <div id="searchResults" class="search-results">
        <div class="search-hint">Tape un mot-clé (modèle, téléphone...) et appuie sur Entrée.</div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="closeSearch">Fermer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  document.getElementById('closeSearch').onclick = () => overlay.remove();
  const input = document.getElementById('searchInput');
  input.focus();
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') runSearch(input.value.trim());
  });
}

async function runSearch(query){
  const resultsEl = document.getElementById('searchResults');
  if(!query){ return; }
  resultsEl.innerHTML = `<div class="search-hint">Recherche en cours...</div>`;

  // recherche immédiate dans les dossiers à distance déjà chargés (pas de requête réseau nécessaire)
  const q = query.toLowerCase();
  const remoteMatches = remoteTasks.filter(t => {
    const hay = `${t.subject} ${t.body} ${t.from} ${(t.attachments || []).map(a => a.filename).join(' ')}`.toLowerCase();
    return hay.includes(q);
  }).map(t => ({
    date: new Date(t.receivedAt),
    html: `
      <div class="search-result">
        <div class="sr-date">${new Date(t.receivedAt).toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'})}</div>
        <div class="sr-body">
          <div class="sr-title">📁 ${escapeHtml(t.subject || '(sans objet)')}</div>
          <div class="sr-phone">${escapeHtml(t.from)}</div>
          ${t.comment ? `<div class="comment-text">"${escapeHtml(t.comment)}"</div>` : ''}
        </div>
        <div class="sr-status">${t.status === 'done' ? 'Fait' : (t.status === 'paused' ? 'En pause' : (t.status === 'cours' ? 'En cours' : 'À faire'))}</div>
      </div>
    `
  }));

  // recherche sur une large plage d'agenda : 2 ans en arrière jusqu'à 3 mois à l'avance
  const now = new Date();
  const timeMin = new Date(now.getFullYear() - 2, now.getMonth(), now.getDate()).toISOString();
  const timeMax = new Date(now.getFullYear(), now.getMonth() + 3, now.getDate()).toISOString();
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(config.calendarId)}/events`
    + `?singleEvents=true&orderBy=startTime&maxResults=50&q=${encodeURIComponent(query)}`
    + `&timeMin=${timeMin}&timeMax=${timeMax}`;
  const res = await authFetch(url);
  let eventMatches = [];
  if(res.ok){
    const data = await res.json();
    eventMatches = (data.items || []).map(mapEvent).map(ev => {
      const parts = parseParts(ev.raw);
      const label = parts ? `${parts.model} — ${parts.presta}` : ev.raw;
      const statusLabel = ev.done ? 'Fait' : (ev.paused ? 'En pause' : (ev.inProgress ? 'En cours' : 'Prévu'));
      return {
        date: ev.startD,
        html: `
          <div class="search-result">
            <div class="sr-date">${ev.startD.toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'})}</div>
            <div class="sr-body">
              <div class="sr-title">${escapeHtml(label)}</div>
              ${parts?.phone ? `<div class="sr-phone">${escapeHtml(parts.phone)}</div>` : ''}
              ${ev.comment ? `<div class="comment-text">"${escapeHtml(ev.comment)}"</div>` : ''}
            </div>
            <div class="sr-status">${statusLabel}</div>
          </div>
        `
      };
    });
  }

  const allResults = [...remoteMatches, ...eventMatches].sort((a, b) => b.date - a.date);

  if(allResults.length === 0){
    resultsEl.innerHTML = `<div class="search-hint">Aucun résultat pour "${escapeHtml(query)}".</div>`;
    return;
  }

  resultsEl.innerHTML = allResults.map(r => r.html).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function startApp(){
  fetchEvents();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(fetchEvents, 5000); // resynchro toutes les 5s

  if(config.remoteWorkerUrl && config.remoteAccessKey){
    fetchRemoteTasks();
    if(remoteTasksTimer) clearInterval(remoteTasksTimer);
    remoteTasksTimer = setInterval(fetchRemoteTasks, 5000);

    scanGmailForNewTasks();
    if(gmailScanTimer) clearInterval(gmailScanTimer);
    gmailScanTimer = setInterval(scanGmailForNewTasks, 60000); // vérifie les nouveaux mails toutes les 60s

    if(remoteReminderTimer) clearInterval(remoteReminderTimer);
    remoteReminderTimer = setInterval(() => {
      const untouched = remoteTasks.some(t => t.status === '');
      if(untouched) playChime();
    }, 20 * 60 * 1000); // rappel toutes les 20 min s'il reste un dossier jamais commencé
  }
}

async function init(){
  await loadConfig();
  if(!config){ renderSetup(); return; }
  renderLoading();
  const ok = await getAccessToken();
  if(ok){ startApp(); }
  // en cas d'échec, getAccessToken a déjà déclenché markConnectionLost(),
  // qui affiche le bandeau et retentera automatiquement — aucune action requise
}

// Sécurité : nettoie toute fenêtre (commentaire/recherche) qui serait restée ouverte par erreur
// et n'aurait pas été retirée — évite qu'un fond assombri reste bloqué à l'écran.
window.addEventListener('pageshow', () => {
  document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
});

init();
</script>
