// Liste des conversations démarrées via l'assistant du site public qui n'ont pas (encore) abouti
// à un rendez-vous — pour rappeler soi-même les clients qui ont hésité ou décroché en cours de
// route. Une conversation sort automatiquement de cette liste dès qu'un rendez-vous est créé
// (le Worker la marque "aboutie" et la conversation reste alors visible depuis la fiche du RDV).
async function openConversationsModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal modal-transcript">
      <h3>💬 Conversations sans rendez-vous</h3>
      <div class="transcript-body"><div class="search-hint">Chargement...</div></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="closeConvList">Fermer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  document.getElementById('closeConvList').onclick = () => overlay.remove();

  const bodyEl = overlay.querySelector('.transcript-body');
  const titleEl = overlay.querySelector('h3');
  let dossiersCache = null;

  // Regroupe les conversations par prénom client détecté (nom renvoyé par le Worker) — celles sans
  // prénom identifié tombent dans un dossier "Inconnu" commun. Ça absorbe au passage les échanges
  // qui se seraient fragmentés en plusieurs entrées côté widget (même client, même dossier).
  function regrouperParNom(liste){
    const groupes = new Map();
    liste.forEach(c => {
      const cle = c.nom || 'Inconnu';
      if(!groupes.has(cle)) groupes.set(cle, []);
      groupes.get(cle).push(c);
    });
    return [...groupes.entries()].map(([nom, convs]) => ({
      nom,
      convs: convs.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || '')),
      dernierUpdatedAt: convs.reduce((max, c) => (c.updatedAt || '') > max ? c.updatedAt : max, '')
    })).sort((a, b) => (b.dernierUpdatedAt || '').localeCompare(a.dernierUpdatedAt || ''));
  }

  function renderDossiers(){
    titleEl.textContent = '💬 Conversations sans rendez-vous';
    if(!dossiersCache || dossiersCache.length === 0){
      bodyEl.innerHTML = `<div class="search-hint">Aucune conversation en attente pour l'instant.</div>`;
      return;
    }
    bodyEl.innerHTML = dossiersCache.map((d, i) => `
      <div class="conv-row" data-idx="${i}">
        <div class="conv-row-date">${formatConvDate(d.dernierUpdatedAt)}</div>
        <div class="conv-row-apercu">📁 ${escapeHtml(d.nom)} ${d.convs.length > 1 ? `<span class="conv-count">(${d.convs.length})</span>` : ''}</div>
      </div>
    `).join('');
    bodyEl.querySelectorAll('.conv-row').forEach(el => {
      el.onclick = () => {
        const d = dossiersCache[Number(el.dataset.idx)];
        if(d.convs.length === 1) afficherDetail(d.convs[0].id, d);
        else renderConvsDuDossier(d);
      };
    });
  }

  function renderConvsDuDossier(dossier){
    titleEl.innerHTML = `💬 ${escapeHtml(dossier.nom)} <span class="conv-back" id="backToFolders">← retour aux conversations</span>`;
    document.getElementById('backToFolders').onclick = renderDossiers;
    bodyEl.innerHTML = dossier.convs.map(c => `
      <div class="conv-row" data-id="${encodeURIComponent(c.id)}">
        <div class="conv-row-date">${formatConvDate(c.updatedAt)}</div>
        <div class="conv-row-apercu">${escapeHtml(c.apercu || '')}</div>
      </div>
    `).join('');
    bodyEl.querySelectorAll('.conv-row').forEach(el => {
      el.onclick = () => afficherDetail(decodeURIComponent(el.dataset.id), dossier);
    });
  }

  async function afficherDetail(id, dossier){
    bodyEl.innerHTML = `<div class="search-hint">Chargement...</div>`;
    titleEl.innerHTML = `💬 Conversation <span class="conv-back" id="backToConvList">← retour</span>`;
    document.getElementById('backToConvList').onclick = () => {
      if(dossier && dossier.convs.length > 1) renderConvsDuDossier(dossier);
      else renderDossiers();
    };
    try{
      const res = await fetchWithTimeout(config.publicBookingWorkerUrl, {
        method: 'POST',
        headers: { 'X-Auth-Key': config.publicBookingAccessKey, 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get_conversation', id })
      }, 20000);
      const data = await res.json();
      if(!res.ok || data.error) throw new Error(data.error || 'Erreur');
      bodyEl.innerHTML = renderTranscriptBubbles(data.transcript);
    }catch(e){
      bodyEl.innerHTML = `<div class="search-hint" style="color:#e05a5a;">Impossible de charger cette conversation.</div>`;
    }
  }

  try{
    const res = await fetchWithTimeout(config.publicBookingWorkerUrl, {
      method: 'POST',
      headers: { 'X-Auth-Key': config.publicBookingAccessKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'list_conversations' })
    }, 20000);
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || 'Erreur');
    dossiersCache = regrouperParNom(data.conversations || []);
    renderDossiers();
  }catch(e){
    bodyEl.innerHTML = `<div class="search-hint" style="color:#e05a5a;">Impossible de charger les conversations. Vérifie la configuration dans ⚙.</div>`;
  }
}

function openSearchModal(){

async function runSearch(query){
  const resultsEl = document.getElementById('searchResults');
  if(!query){ return; }
  resultsEl.innerHTML = `<div class="search-hint">Recherche en cours...</div>`;

  // recherche immédiate dans les dossiers à distance déjà chargés (pas de requête réseau nécessaire)
  const q = query.toLowerCase();
  const remoteMatches = remoteTasks.filter(t => {
    const hay = `${t.subject} ${t.body} ${t.from} ${(t.attachments || []).map(a => a.filename).join(' ')}`.toLowerCase();
    return hay.includes(q);
  }).map(t => ({
    date: new Date(t.receivedAt),
    html: `
      <div class="search-result">
        <div class="sr-date">${new Date(t.receivedAt).toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'})}</div>
        <div class="sr-body">
          <div class="sr-title">📁 ${escapeHtml(t.subject || '(sans objet)')}</div>
          <div class="sr-phone">${escapeHtml(t.from)}</div>
          ${t.comment ? `<div class="comment-text">"${escapeHtml(t.comment)}"</div>` : ''}
        </div>
        <div class="sr-status">${t.status === 'done' ? 'Fait' : (t.status === 'paused' ? 'En pause' : (t.status === 'cours' ? 'En cours' : 'À faire'))}</div>
      </div>
    `
  }));

  // recherche sur une large plage d'agenda : 2 ans en arrière jusqu'à 3 mois à l'avance
  const now = new Date();
  const timeMin = new Date(now.getFullYear() - 2, now.getMonth(), now.getDate()).toISOString();
  const timeMax = new Date(now.getFullYear(), now.getMonth() + 3, now.getDate()).toISOString();
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(config.calendarId)}/events`
    + `?singleEvents=true&orderBy=startTime&maxResults=50&q=${encodeURIComponent(query)}`
    + `&timeMin=${timeMin}&timeMax=${timeMax}`;
  const res = await authFetch(url);
  let eventMatches = [];
  if(res.ok){
    const data = await res.json();
    eventMatches = (data.items || []).map(mapEvent).map(ev => {
      const parts = parseParts(ev.raw);
      const label = parts ? `${parts.model} — ${parts.presta}` : ev.raw;
      const statusLabel = ev.done ? 'Fait' : (ev.paused ? 'En pause' : (ev.inProgress ? 'En cours' : 'Prévu'));
      return {
        date: ev.startD,
        id: ev.id,
        ev, // événement déjà mappé, réutilisé tel quel à l'ouverture (voir openEditEventModal plus haut)
        html: `
          <div class="search-result clickable" data-event-id="${ev.id}" title="Cliquer pour ouvrir ce rendez-vous">
            <div class="sr-date">${ev.startD.toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'})}</div>
            <div class="sr-body">
              <div class="sr-title">${escapeHtml(label)}</div>
              ${parts?.phone ? `<div class="sr-phone">${escapeHtml(parts.phone)}</div>` : ''}
              ${ev.comment ? `<div class="comment-text">"${escapeHtml(ev.comment)}"</div>` : ''}
            </div>
            <div class="sr-status">${statusLabel}</div>
          </div>
        `
      };
    });
  }

  const allResults = [...remoteMatches, ...eventMatches].sort((a, b) => b.date - a.date);

  if(allResults.length === 0){
    resultsEl.innerHTML = `<div class="search-hint">Aucun résultat pour "${escapeHtml(query)}".</div>`;
    return;
  }

  resultsEl.innerHTML = allResults.map(r => r.html).join('');

  // clic sur un résultat "rendez-vous" (calendrier) : ouvre directement la fiche de modification,
  // avec l'événement déjà récupéré par la recherche — pas besoin qu'il soit dans la fenêtre affichée.
  resultsEl.querySelectorAll('.search-result[data-event-id]').forEach(el => {
    el.onclick = () => {
      const match = eventMatches.find(r => r.id === el.dataset.eventId);
      if(!match) return;
      const overlay = resultsEl.closest('.modal-overlay');
      if(overlay) overlay.remove();
      openEditEventModal(match.id, match.ev);
    };
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function startApp(){
  fetchEvents();
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(fetchEvents, 5000); // resynchro toutes les 5s

  if(config.remoteWorkerUrl && config.remoteAccessKey){
    fetchRemoteTasks();
    if(remoteTasksTimer) clearInterval(remoteTasksTimer);
    remoteTasksTimer = setInterval(fetchRemoteTasks, 5000);

    scanGmailForNewTasks();
    if(gmailScanTimer) clearInterval(gmailScanTimer);
    gmailScanTimer = setInterval(scanGmailForNewTasks, 60000); // vérifie les nouveaux mails toutes les 60s

    if(remoteReminderTimer) clearInterval(remoteReminderTimer);
    remoteReminderTimer = setInterval(() => {
      const untouched = remoteTasks.some(t => t.status === '');
      if(untouched) playChime();
    }, 20 * 60 * 1000); // rappel toutes les 20 min s'il reste un dossier jamais commencé
  }
}

async function init(){
  await loadConfig();
  if(!config){ renderSetup(); return; }
  renderLoading();
  const ok = await getAccessToken();
  if(ok){ startApp(); }
  // en cas d'échec, getAccessToken a déjà déclenché markConnectionLost(),
  // qui affiche le bandeau et retentera automatiquement — aucune action requise
}

// Sécurité : nettoie toute fenêtre (commentaire/recherche) qui serait restée ouverte par erreur
// et n'aurait pas été retirée — évite qu'un fond assombri reste bloqué à l'écran.
window.addEventListener('pageshow', () => {
  document.querySelectorAll('.modal-overlay').forEach(el => el.remove());
});

init();
</script>
