<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant AG Sport Reprog</title>
<style>
  :root{
    --bg: #14161a;
    --panel: #1d2027;
    --panel-2: #262a33;
    --line-solid: #383d47;
    --accent: #ff6a2b;
    --text: #f2f0ea;
    --text-dim: #9aa0ab;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html, body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system, 'Segoe UI', Roboto, sans-serif;
    display:flex; flex-direction:column; height:100%;
  }
  .widget-header{
    padding:14px 16px; border-bottom:1px solid var(--line-solid);
    display:flex; align-items:center; gap:10px; flex-shrink:0;
  }
  .widget-header .dot{width:8px; height:8px; border-radius:50%; background:var(--accent);}
  .widget-header h1{font-size:14px; margin:0; font-weight:700;}
  .widget-header .sub{font-size:11px; color:var(--text-dim); margin-top:1px;}
  .chat-messages{
    flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:10px;
  }
  .chat-bubble{padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.45; max-width:88%;}
  .chat-bubble.user{background:var(--accent); color:#1a0d05; align-self:flex-end;}
  .chat-bubble.assistant{background:var(--panel-2); color:var(--text); align-self:flex-start;}
  .chat-bubble.tool-info{background:transparent; border:1px dashed var(--line-solid); color:var(--text-dim); font-size:12px; align-self:center; font-style:italic; max-width:95%;}
  .chat-input-row{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line-solid); flex-shrink:0;}
  .chat-input-row input{flex:1; padding:11px 13px; border-radius:9px; border:1px solid var(--line-solid); background:var(--panel-2); color:var(--text); font-family:inherit; font-size:14px;}
  .chat-input-row input:focus{outline:1px solid var(--accent);}
  .chat-input-row button{padding:11px 16px; border-radius:9px; border:none; background:var(--accent); color:#1a0d05; font-weight:700; cursor:pointer; font-size:14px;}
  .chat-input-row button:disabled{opacity:0.5; cursor:default;}
  .checkout-prompt{background:var(--panel-2); border:1px solid var(--accent); border-radius:10px; padding:14px;}
  .checkout-prompt .policy{font-size:12.5px; color:var(--text-dim); margin-bottom:10px; line-height:1.4;}
  .checkout-prompt button{
    width:100%; padding:12px; border-radius:9px; border:none; background:var(--accent);
    color:#1a0d05; font-weight:700; cursor:pointer; font-size:14px;
  }
</style>
</head>
<body>
  <div class="widget-header">
    <div class="dot"></div>
    <div>
      <h1>AG Sport Reprog</h1>
      <div class="sub">Conseil &amp; prise de rendez-vous</div>
    </div>
  </div>
  <div id="chatMessages" class="chat-messages"></div>
  <div class="chat-input-row">
    <input id="chatInput" placeholder="Écrivez votre message...">
    <button id="chatSendBtn">Envoyer</button>
  </div>

<script>
  // ---------------------------------------------------------------------
  // Configuration — à compléter une fois le Worker public-booking-api déployé
  // ---------------------------------------------------------------------
  const PUBLIC_BOOKING_WORKER_URL = 'https://public-booking-api.VOTRE-SOUS-DOMAINE.workers.dev';
  const PUBLIC_BOOKING_ACCESS_KEY = 'VOTRE_CLE_ACCES';
  // ---------------------------------------------------------------------

  let conversationMessages = [];

  function addChatBubble(role, text){
    const el = document.getElementById('chatMessages');
    const bubble = document.createElement('div');
    bubble.className = `chat-bubble ${role}`;
    bubble.textContent = text;
    el.appendChild(bubble);
    el.scrollTop = el.scrollHeight;
    return bubble;
  }

  function addChatInfo(text){
    const el = document.getElementById('chatMessages');
    const bubble = document.createElement('div');
    bubble.className = 'chat-bubble tool-info';
    bubble.textContent = text;
    el.appendChild(bubble);
    el.scrollTop = el.scrollHeight;
    return bubble;
  }

  function showCheckoutButton(url){
    const el = document.getElementById('chatMessages');
    const wrap = document.createElement('div');
    wrap.className = 'chat-bubble assistant';
    wrap.innerHTML = `
      <div class="checkout-prompt">
        <div class="policy">🔒 Pour finaliser le rendez-vous, enregistrez votre carte bancaire sur la page sécurisée Stripe. Aucun débit n'est effectué maintenant.</div>
        <button id="goToStripeBtn">Enregistrer ma carte →</button>
      </div>
    `;
    el.appendChild(wrap);
    el.scrollTop = el.scrollHeight;
    wrap.querySelector('#goToStripeBtn').onclick = () => {
      // window.top pour sortir du cadre iframe et occuper toute la fenêtre du navigateur —
      // important pour l'expérience de paiement Stripe, pas pensée pour tenir dans un petit cadre.
      window.top.location.href = url;
    };
  }

  const STOCKAGE_CLE = 'agsr_conversation';

  function sauvegarderConversation(){
    try{ localStorage.setItem(STOCKAGE_CLE, JSON.stringify(conversationMessages)); }catch(e){}
  }

  // Reconstruit les bulles visibles à partir de l'historique sauvegardé (avant le passage par
  // Stripe, qui recharge entièrement la page et efface la mémoire du widget en cours de route).
  // Les tool_result / tool_use internes ne sont jamais réaffichés, seulement les vrais échanges.
  function restaurerConversation(){
    try{
      const sauvegarde = localStorage.getItem(STOCKAGE_CLE);
      if(!sauvegarde) return false;
      const messages = JSON.parse(sauvegarde);
      if(!Array.isArray(messages) || messages.length === 0) return false;
      conversationMessages = messages;
      messages.forEach(msg => {
        if(msg.role === 'user' && typeof msg.content === 'string'){
          addChatBubble('user', msg.content);
        } else if(msg.role === 'assistant' && Array.isArray(msg.content)){
          const textes = msg.content.filter(b => b.type === 'text').map(b => b.text);
          if(textes.length) addChatBubble('assistant', textes.join('\n\n'));
        }
      });
      return true;
    }catch(e){
      return false;
    }
  }

  async function sendMessage(text){
    if(!text.trim()) return;
    addChatBubble('user', text);
    conversationMessages.push({ role: 'user', content: text });
    sauvegarderConversation();
    document.getElementById('chatInput').value = '';
    document.getElementById('chatSendBtn').disabled = true;
    const loadingBubble = addChatInfo('...réflexion...');

    try{
      const res = await fetch(PUBLIC_BOOKING_WORKER_URL, {
        method: 'POST',
        headers: { 'X-Auth-Key': PUBLIC_BOOKING_ACCESS_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversationMessages })
      });
      loadingBubble.remove();
      const data = await res.json();
      if(!res.ok || data.error){
        addChatInfo("Un problème est survenu. Contactez-nous directement au 07 69 37 70 92.");
        return;
      }
      if(data.messages) conversationMessages = data.messages; // historique complet tenu à jour par le serveur
      sauvegarderConversation();
      if(data.reply) addChatBubble('assistant', data.reply);
      if(data.checkoutUrl) showCheckoutButton(data.checkoutUrl);
    }catch(e){
      loadingBubble.remove();
      addChatInfo("Connexion impossible pour le moment. Contactez-nous directement au 07 69 37 70 92.");
    }finally{
      document.getElementById('chatSendBtn').disabled = false;
    }
  }

  document.getElementById('chatSendBtn').onclick = () => sendMessage(document.getElementById('chatInput').value);
  document.getElementById('chatInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') sendMessage(document.getElementById('chatInput').value);
  });

  // Retour depuis Stripe Checkout (voir success_url/cancel_url dans le Worker) : le site parent
  // rouvre ce widget avec ?confirme=1 ou ?annule=1 dans l'URL. La page a été entièrement rechargée
  // pour aller sur Stripe et revenir, donc la conversation est restaurée depuis localStorage
  // plutôt que de repartir à zéro — la confirmation s'ajoute à la suite de l'échange précédent.
  const params = new URLSearchParams(window.location.search);
  if(params.get('confirme') === '1'){
    restaurerConversation();
    addChatBubble('assistant', "✅ Empreinte bancaire réussie, je vous confirme le rendez-vous ! Nous vous attendons à l'atelier.");
    localStorage.removeItem(STOCKAGE_CLE);
  } else if(params.get('annule') === '1'){
    restaurerConversation();
    addChatBubble('assistant', "Pas de souci, vous n'avez pas terminé l'enregistrement de la carte — le rendez-vous n'est donc pas encore confirmé. Vous pouvez réessayer, ou me poser une question.");
  } else {
    addChatBubble('assistant', "Bienvenue chez AG Sport Reprog ! Je suis là pour vous conseiller et prendre votre rendez-vous.");
  }
</script>
</body>
</html>
