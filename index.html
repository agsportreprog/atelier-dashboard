<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Atelier — Planning du jour</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff6a2b">
<style>
  :root{
    --bg: #14161a;
    --panel: #1d2027;
    --panel-2: #262a33;
    --line: #33384433;
    --line-solid: #383d47;
    --accent: #ff6a2b;
    --accent-dim: #ff6a2b22;
    --done: #3ecf8e;
    --done-dim: #3ecf8e22;
    --cours: #4a9eff;
    --cours-dim: #4a9eff22;
    --courtesy: #a78bfa;
    --courtesy-dim: #a78bfa22;
    --text: #f2f0ea;
    --text-dim: #9aa0ab;
    --mono: 'SF Mono', 'Consolas', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; overflow-x:hidden;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    padding:18px 28px; border-bottom:1px solid var(--line-solid);
    background: linear-gradient(180deg, #191c22, #14161a);
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .brand .dot{width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 14px var(--accent);}
  .brand h1{font-size:15px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; margin:0; color:var(--text-dim);}
  .brand .date{font-size:20px; font-weight:700; margin-top:2px; text-transform:capitalize;}
  .status{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:12px; color:var(--text-dim);}
  .status .led{width:8px; height:8px; border-radius:50%; background:#555;}
  .suite-tabs{display:flex; gap:4px; background:var(--panel-2); padding:4px; border-radius:10px; border:1px solid var(--line-solid);}
  .tab-link{
    padding:8px 14px; border-radius:7px; font-size:12px; font-weight:600; text-decoration:none;
    color:var(--text-dim); white-space:nowrap;
  }
  .tab-link.active{background:var(--accent); color:#1a0d05;}
  .tab-link:not(.active):hover{color:var(--text);}
  .status .led.live{background:var(--done); box-shadow:0 0 8px var(--done);}
  .status .led.lost{background:#ff5555; box-shadow:0 0 8px #ff5555; display:inline-block; margin-right:8px;}
  .reconnect-btn{
    display:flex; align-items:center; background:#ff555522; border:1px solid #ff5555;
    color:#ff9c9c; padding:8px 14px; border-radius:8px; font-size:12px; font-weight:700;
    cursor:pointer; font-family:inherit; animation: pulse-glow 1.6s ease-in-out infinite;
  }
  @keyframes pulse-glow{
    0%, 100%{ box-shadow:0 0 0 0 #ff555555; }
    50%{ box-shadow:0 0 0 6px #ff555500; }
  }
  .status button{
    background:var(--panel-2); border:1px solid var(--line-solid); color:var(--text);
    padding:8px 14px; border-radius:8px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .status button:active{transform:scale(.96);}

  .counts{display:flex; gap:10px; padding:16px 28px 0;}
  .pill{
    font-family:var(--mono); font-size:12px; padding:6px 12px; border-radius:20px;
    border:1px solid var(--line-solid); color:var(--text-dim);
  }
  .pill b{color:var(--text); font-size:14px;}
  .pill-warning{
    cursor:pointer; border-color:#e0785a; color:#e0a08a; background:#e0785a1a;
  }
  .pill-warning b{color:#e0785a;}
  .pill-warning:hover{background:#e0785a33;}

  .list{padding:16px 28px 40px; display:flex; flex-direction:column; gap:10px;}

  .day-header{
    display:flex; align-items:baseline; gap:10px; margin:22px 0 4px; padding-bottom:8px;
    border-bottom:1px solid var(--line-solid);
  }
  .day-header:first-child{margin-top:0;}
  .day-header .label{font-size:16px; font-weight:700; text-transform:capitalize;}
  .day-header .today-tag{
    font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.05em;
    background:var(--accent); color:#1a0d05; padding:3px 8px; border-radius:6px; text-transform:uppercase;
  }
  .day-header .count{font-size:12px; color:var(--text-dim); margin-left:auto; font-family:var(--mono);}

  .multiday-tag{
    display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    background:var(--panel-2); border:1px solid var(--line-solid); color:var(--text-dim);
    padding:2px 7px; border-radius:6px; margin-top:2px;
  }

  .card{
    display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--line-solid); border-radius:14px;
    overflow:hidden; transition: opacity .25s, transform .15s;
  }
  .card.done{opacity:.7;}
  .card.paused{opacity:.78;}
  .card.block-card{border-color:#e0785a55; background:#e0785a0d;}
  .card.block-card .time{background:#e0785a1a; color:#e0785a;}

  /* Vue calendrier mensuel — grille cliquable pour sauter directement sur un jour, sans scroller
     la liste depuis aujourd'hui (utile pour un RDV pris loin dans le temps). */
  .cal-wrap{padding:4px 4px 24px;}
  .cal-nav{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding:8px 0 18px;
  }
  .cal-nav-btn{
    background:var(--panel-2); border:1px solid var(--line-solid); color:var(--text);
    width:34px; height:34px; border-radius:9px; font-size:14px; cursor:pointer;
  }
  .cal-nav-btn:hover{background:var(--panel);}
  .cal-month-label{font-size:17px; font-weight:700; text-transform:capitalize; min-width:170px; text-align:center;}
  .cal-today-btn{
    background:var(--accent-dim); border:1px solid transparent; color:var(--accent);
    font-weight:700; font-size:12px; padding:8px 14px; border-radius:9px; cursor:pointer; margin-left:8px;
  }
  .cal-today-btn:hover{background:#ff6a2b33;}
  .cal-grid{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:6px; max-width:840px; margin:0 auto;
  }
  .cal-weekday{
    text-align:center; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text-dim); padding-bottom:6px;
  }
  .cal-cell{
    position:relative; aspect-ratio:1; border:1px solid var(--line-solid); border-radius:10px;
    background:var(--panel); padding:8px; cursor:pointer; transition:background .15s, transform .1s;
  }
  .cal-cell:hover{background:var(--panel-2); transform:translateY(-1px);}
  .cal-cell.cal-outside{opacity:.35;}
  .cal-cell.cal-today{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
  .cal-cell.cal-has-events{background:var(--accent-dim);}
  .cal-daynum{font-size:13px; font-weight:700;}
  .cal-count{
    position:absolute; bottom:8px; right:8px; min-width:20px; height:20px; padding:0 5px;
    border-radius:10px; background:var(--accent); color:#fff; font-size:11px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .cal-block-tag{position:absolute; bottom:8px; left:8px; font-size:12px;}
  .cal-hint{text-align:center; color:var(--text-dim); font-size:12px; margin-top:16px;}
  @media (max-width: 640px){
    .cal-daynum{font-size:11px;}
    .cal-count{min-width:16px; height:16px; font-size:9px;}
    .cal-month-label{font-size:15px; min-width:120px;}
  }
  .card.paused .time{background:#ffc94622;}
  .card.inprogress .time{background:var(--cours-dim);}
  .card.has-courtesy{border-left:3px solid var(--courtesy);}
  .courtesy-badge{
    display:inline-block; background:var(--courtesy-dim); color:var(--courtesy);
    padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700; margin-top:4px;
  }
  .modal .field select{
    width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--line-solid);
    background:var(--panel-2); color:var(--text); font-family:inherit; font-size:14px;
  }
  .card-top{display:flex; align-items:stretch;}
  .card-actions{display:flex; border-top:1px solid var(--line-solid);}
  .action-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:12px 6px; background:var(--panel-2); border:none; border-right:1px solid var(--line-solid);
    color:#c2c8d2; font-family:inherit; font-size:12px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; cursor:pointer;
  }
  .action-btn:last-child{border-right:none;}
  .action-btn svg{width:16px; height:16px; opacity:.75;}
  .action-btn.cours-btn.on{background:#4a9eff3d; color:#7ec2ff;}
  .action-btn.cours-btn.on svg{opacity:1;}
  .action-btn.pause-btn.on{background:#ffc9463d; color:#ffd873;}
  .action-btn.pause-btn.on svg{opacity:1;}
  .action-btn.done-btn.on{background:#3ecf8e3d; color:#6fe0ac;}
  .action-btn.done-btn.on svg{opacity:1;}
  .card .time{
    width:118px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--panel-2); font-family:var(--mono); font-weight:700; font-size:14px; border-right:1px solid var(--line-solid);
    text-align:center; line-height:1.5;
  }
  .card .time .arrow{display:block; font-size:10px; color:var(--text-dim); font-weight:400; margin:2px 0;}
  .card .time span{font-size:10px; font-weight:400; color:var(--text-dim); margin-top:2px;}
  .card .time .time-tarif{
    display:flex; align-items:center; gap:3px; margin-top:6px; font-size:11px; font-weight:700;
    color:#5aa8e0; cursor:pointer; font-family:inherit;
  }
  .card .time .time-tarif:hover{ color:var(--accent); }
  .card .time .time-tarif .pencil{ font-size:10px; opacity:.75; }
  .card .body{flex:1; padding:14px 18px; display:flex; flex-direction:column; gap:4px; min-width:0;}
  .card .model{font-size:17px; font-weight:700;}
  .card .presta{font-size:13px; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
  .card .phone{font-size:13px; color:var(--text-dim); font-family:var(--mono);}
  .card .raw{font-size:13px; color:var(--text-dim);}
  .comment-text{
    font-size:13px; color:var(--text-dim); font-style:italic; margin-top:2px;
    padding:6px 10px; background:var(--panel-2); border-radius:8px; border-left:2px solid var(--accent);
  }
  .comment-btn{
    font-size:12px; color:var(--accent); margin-top:4px; cursor:pointer; width:fit-content;
  }
  /* Rangée compacte pour tous les boutons d'action d'une carte de rendez-vous (modifier, commentaire,
     performances, courtoisie, tarif, empreinte, conversation) — passe à la ligne au besoin, pour que
     la carte reste courte même avec beaucoup de boutons disponibles. */
  .action-links{
    display:flex; flex-wrap:wrap; gap:6px 8px; margin-top:8px;
  }
  .action-links .comment-btn{
    margin-top:0; padding:4px 10px; border-radius:14px; border:1px solid var(--line-solid);
    background:var(--panel-2); white-space:nowrap;
  }
  .action-links .comment-btn:hover{ border-color:var(--accent); }
  .tool-tag{
    display:inline-block; background:var(--panel-2); border:1px solid var(--line-solid);
    padding:1px 7px; border-radius:5px; font-size:10px; margin-left:6px; color:var(--text-dim);
    text-transform:none; letter-spacing:0; font-weight:600;
  }
  .attachments-list{display:flex; flex-direction:column; gap:3px; margin-top:6px;}
  .attachment-link{
    font-size:12px; color:var(--cours); cursor:pointer; width:fit-content;
  }
  .attachment-link:hover{text-decoration:underline;}

  .modal-overlay{
    position:fixed; inset:0; background:#000a; display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal{
    background:var(--panel); border:1px solid var(--line-solid); border-radius:16px;
    padding:24px; width:100%; max-width:440px;
  }
  .modal h3{margin:0 0 14px; font-size:16px;}
  .modal textarea{
    width:100%; min-height:110px; padding:12px 14px; padding-right:52px; border-radius:10px; border:1px solid var(--line-solid);
    background:var(--panel-2); color:var(--text); font-family:inherit; font-size:14px; resize:vertical;
  }
  .textarea-wrap{position:relative;}
  .voice-btn{
    position:absolute; bottom:10px; right:10px; width:36px; height:36px; border-radius:50%;
    border:1px solid var(--line-solid); background:var(--panel); color:var(--text-dim);
    font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition: all .15s;
  }
  .voice-btn.listening{
    background:#ff5555; border-color:#ff5555; color:white;
    animation: pulse-glow 1.2s ease-in-out infinite;
  }
  .modal .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal .modal-actions button{
    flex:1; padding:12px; border-radius:10px; border:none; font-weight:700; font-size:14px; cursor:pointer;
  }
  .modal .btn-save{background:var(--accent); color:#1a0d05;}
  .modal .btn-cancel{background:var(--panel-2); color:var(--text); border:1px solid var(--line-solid) !important;}
  .modal .field{margin-bottom:14px;}
  .modal .field label{display:block; font-size:11px; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em;}
  .modal .field.required label::after{content:' *'; color:var(--accent);}
  .modal .field input{
    width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--line-solid);
    background:var(--panel-2); color:var(--text); font-family:inherit; font-size:14px;
  }
  .sans-empreinte-list{display:flex; flex-direction:column; gap:10px; max-height:52vh; overflow-y:auto; margin-bottom:14px;}
  .sans-empreinte-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 12px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line-solid);
  }
  .sans-empreinte-row .sr-model{font-size:14px; font-weight:700;}
  .sans-empreinte-row .sr-meta{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .sans-empreinte-row .comment-btn{margin-top:0; white-space:nowrap;}
  .perf-summary{font-size:12px; color:var(--text-dim); margin-top:6px; font-family:var(--mono);}
  .mini-cal{background:var(--panel-2); border:1px solid var(--line-solid); border-radius:10px; padding:12px; margin-top:4px; max-width:480px;}
  .mc-loading{display:block; text-transform:none; letter-spacing:0; font-size:12px; color:var(--text-dim); font-weight:400; margin-bottom:10px;}
  .mc-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .mc-title{font-size:13px; font-weight:700; text-transform:capitalize; color:var(--text);}
  .mc-nav{background:var(--panel); border:1px solid var(--line-solid); color:var(--text); width:26px; height:26px; border-radius:6px; cursor:pointer; font-size:14px; line-height:1;}
  .mc-nav:disabled{opacity:.3; cursor:default;}
  .mc-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:10px; color:var(--text-dim); margin-bottom:5px; font-weight:600;}
  .mc-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .mc-cell{
    position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:6px; font-size:12px; cursor:pointer; background:var(--panel); color:var(--text);
  }
  .mc-day{display:flex; flex-direction:column; align-items:center; line-height:1.05;}
  .mc-day small{font-size:7px; text-transform:uppercase; color:var(--text-dim); font-weight:600; margin-top:1px;}
  .mc-cell.mc-selected .mc-day small{color:#1a0d05aa;}
  .mc-cell.mc-empty{visibility:hidden; cursor:default;}
  .mc-cell.mc-busy{background:var(--accent-dim); color:var(--accent); font-weight:600;}
  .mc-cell.mc-selected{background:var(--accent); color:#1a0d05; font-weight:700;}
  .mc-count{
    position:absolute; bottom:1px; right:1px; font-size:8px; background:var(--accent); color:#1a0d05;
    border-radius:50%; width:13px; height:13px; display:flex; align-items:center; justify-content:center; font-weight:700;
  }
  .mc-cell.mc-selected .mc-count{background:#1a0d05; color:var(--accent);}
  .modal-transcript{max-width:560px; max-height:84vh; display:flex; flex-direction:column;}
  .transcript-body{overflow-y:auto; flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; padding-right:4px; margin-bottom:4px;}
  .transcript-line{max-width:88%; padding:9px 12px; border-radius:12px; font-size:13px; line-height:1.4;}
  .transcript-who{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px; opacity:.7;}
  .transcript-client{align-self:flex-start; background:var(--panel-2); border:1px solid var(--line-solid); color:var(--text);}
  .transcript-assistant{align-self:flex-end; background:var(--accent-dim); color:var(--text);}
  .conv-row{padding:10px 12px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line-solid); cursor:pointer;}
  .conv-row:hover{border-color:var(--accent);}
  .conv-row-date{font-size:11px; color:var(--text-dim); margin-bottom:3px; font-family:var(--mono);}
  .conv-row-apercu{font-size:13px; color:var(--text);}
  .conv-count{font-size:11px; color:var(--text-dim); font-weight:400;}
  .conv-back{font-size:12px; color:var(--accent); cursor:pointer; font-weight:400; text-transform:none; letter-spacing:0;}
  .modal-newevent{max-width:none; width:98vw; max-height:96vh; overflow-y:auto;}
  .modal-newevent .newevent-left{flex:0 0 360px;}
  .modal-newevent .newevent-right{flex:1 1 600px;}
  .month-summary{
    display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;
  }
  .month-summary .pill{font-family:var(--mono); font-size:12px; padding:6px 12px; border-radius:20px; border:1px solid var(--line-solid); color:var(--text-dim);}
  .month-summary .pill b{color:var(--text); font-size:14px;}
  .newevent-columns{display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start;}
  .newevent-left{flex:1 1 340px; min-width:280px;}
  .newevent-right{flex:1 1 340px; min-width:280px; border-left:1px solid var(--line-solid); padding-left:28px;}
  @media (max-width: 720px){
    .newevent-right{border-left:none; padding-left:0; border-top:1px solid var(--line-solid); padding-top:20px; margin-top:8px;}
  }
  .day-agenda-title{font-size:13px; font-weight:700; margin-bottom:12px; text-transform:capitalize; color:var(--text);}
  #dayAgendaPanel .search-result{margin-bottom:8px; padding:12px 14px;}
  #dayAgendaPanel .search-result.multiday{padding:7px 12px; opacity:.75;}
  #dayAgendaPanel .search-result.multiday .sr-title{
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; font-size:12px; font-weight:600;
  }
  #dayAgendaPanel .search-result.multiday .sr-date{font-size:10px; width:auto;}
  .sr-courtesy{
    display:block; font-size:11px; color:var(--courtesy); margin-top:3px; font-weight:600;
  }
  .perf-actions{display:flex; gap:14px; margin-top:4px; flex-wrap:wrap;}

  .modal-search{max-width:560px;}
  .modal-search #searchInput{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line-solid);
    background:var(--panel-2); color:var(--text); font-family:inherit; font-size:14px; margin-bottom:14px;
  }
  .search-results{max-height:50vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px;}
  .search-hint{color:var(--text-dim); font-size:13px; padding:10px 2px;}
  .search-result{
    display:flex; gap:12px; align-items:flex-start; background:var(--panel-2);
    border:1px solid var(--line-solid); border-radius:10px; padding:10px 12px;
  }
  .search-result.clickable{cursor:pointer;}
  .search-result.clickable:hover{border-color:var(--accent);}
  .sr-date{font-family:var(--mono); font-size:11px; color:var(--text-dim); width:72px; flex-shrink:0; padding-top:2px;}
  .sr-body{flex:1; min-width:0;}
  .sr-title{font-size:14px; font-weight:700;}
  .sr-phone{font-size:12px; color:var(--text-dim); font-family:var(--mono);}
  .sr-status{font-size:11px; color:var(--text-dim); flex-shrink:0; text-transform:uppercase; padding-top:2px;}
  .card.done .time{background:var(--done-dim);}

  .empty{padding:60px 20px; text-align:center; color:var(--text-dim);}
  .empty .big{font-size:15px; margin-bottom:6px; color:var(--text);}

  .setup{max-width:480px; margin:60px auto; padding:0 20px;}
  .setup h2{font-size:18px; margin-bottom:4px;}
  .setup p{color:var(--text-dim); font-size:13px; line-height:1.5;}
  .setup label{display:block; font-size:12px; color:var(--text-dim); margin:16px 0 6px;}
  .setup input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line-solid);
    background:var(--panel); color:var(--text); font-family:var(--mono); font-size:13px;
  }
  .setup .checkbox-row{
    display:flex; align-items:center; gap:8px; margin-top:18px; font-size:13px; color:var(--text-dim);
    cursor:pointer;

function getBusyCourtesyKeys(dateFrom, dateTo, excludeId){
  const from = new Date(dateFrom + 'T00:00:00');
  const to = new Date((dateTo || dateFrom) + 'T23:59:59');
  const busy = new Set();
  events.forEach(ev => {
    if(!ev.courtesyCar || ev.id === excludeId) return;
    if(ev.startD <= to && ev.endD >= from) busy.add(ev.courtesyCar);
  });
  return busy;
}

}

// l'objet du mail reçu — renvoie null si aucune plaque reconnaissable n'est trouvée.
function extractPlaque(subject){
  const m = (subject || '').match(/\b([A-Za-z]{2})[\s-]?(\d{3})[\s-]?([A-Za-z]{2})\b/);
  if(!m) return null;
  return `${m[1].toUpperCase()}-${m[2]}-${m[3].toUpperCase()}`;
}

function playChime(){
  if(config?.soundEnabled === false) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    const startAt = ctx.currentTime;

    // Alarme en rafale : 3 bips stridents montants-descendants, volume élevé
    for(let i = 0; i < 3; i++){
      const t0 = startAt + i * 0.26;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1100, t0);
      osc.frequency.exponentialRampToValueAtTime(1900, t0 + 0.09);
      osc.frequency.exponentialRampToValueAtTime(1100, t0 + 0.2);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.55, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.24);
    }
  }catch(e){}
}

// Récupère un jeton d'accès frais auprès du relais Cloudflare (aucune interaction utilisateur,
// aucune dépendance aux cookies du navigateur : fonctionne indéfiniment sans surveillance)
// fetch avec délai maximum, et une retentative silencieuse avant d'abandonner pour de bon
async function fetchWithTimeout(url, options = {}, timeoutMs = 20000, retriesLeft = 1){
  try{
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    const res = await fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
    return res;
  }catch(e){
    if(retriesLeft > 0){
      await new Promise(r => setTimeout(r, 1000)); // petite pause avant de retenter
      return fetchWithTimeout(url, options, timeoutMs, retriesLeft - 1);
    }
    throw e;
  }
}

async function getAccessToken(){
  try{
    const res = await fetchWithTimeout(config.workerUrl);
    if(!res.ok) throw new Error('relais indisponible');
    const data = await res.json();
    if(!data.access_token) throw new Error('réponse invalide');
    accessToken = data.access_token;
    connectionLost = false;
    if(tokenTimer) clearTimeout(tokenTimer);
    const delayMs = Math.max((data.expires_in - 300) * 1000, 30000);
    tokenTimer = setTimeout(getAccessToken, delayMs);
    return true;
  }catch(e){
    markConnectionLost();
    return false;
  }
}

// Requête authentifiée avec retentative automatique et unique si le jeton a expiré entre-temps
async function authFetch(url, options = {}, allowRetry = true){
  const opts = { ...options, headers: { ...(options.headers || {}), Authorization: `Bearer ${accessToken}` } };
  const res = await fetchWithTimeout(url, opts);
  if(res.status === 401 && allowRetry){
    const ok = await getAccessToken();
    if(ok) return authFetch(url, options, false);
  }
  return res;
}

function markConnectionLost(){
  connectionLost = true;
  renderList();

  }, 15000);
}

let vueMois = false; // false = 3 jours (par défaut), true = jusqu'à 31 jours à partir d'aujourd'hui
function joursAffiches(){ return vueMois ? 31 : 3; }

// Vue calendrier mensuel : grille du mois cliquable, pour sauter directement sur un jour précis
// (ex : un RDV pris fin octobre) sans avoir à scroller la liste jour par jour depuis aujourd'hui,
// qui devient injouable au-delà de quelques semaines.
let vueCalendrier = false;
let calendrierMonth = startOfMonth(new Date()); // 1er du mois actuellement affiché dans la grille
let focusDate = null; // jour choisi dans la grille : ancre la liste sur ce jour au lieu d'aujourd'hui

function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
// Lundi de la semaine contenant d (la semaine commence le lundi, convention FR)
function mondayOfWeek(d){
  const jour = d.getDay(); // 0 = dimanche ... 6 = samedi
  const decalage = jour === 0 ? -6 : 1 - jour;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + decalage);
}

function windowRange(){
  if(vueCalendrier){
    // Toute la grille affichée (semaines entières, y compris les jours du mois précédent/suivant
    // visibles en début/fin de grille), pas seulement le 1er-dernier du mois.
    const debutGrille = mondayOfWeek(calendrierMonth);
    const finMoisAffiche = new Date(calendrierMonth.getFullYear(), calendrierMonth.getMonth() + 1, 0);
    const finSemaineFinMois = mondayOfWeek(finMoisAffiche);
    const finGrille = new Date(finSemaineFinMois.getFullYear(), finSemaineFinMois.getMonth(), finSemaineFinMois.getDate() + 6, 23,59,59);
    return { timeMin: debutGrille.toISOString(), timeMax: finGrille.toISOString(), start: debutGrille, end: finGrille };
  }
  const now = focusDate || new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0,0,0);
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + joursAffiches() - 1, 23,59,59);
  return { timeMin: start.toISOString(), timeMax: end.toISOString(), start, end };
}

function dayKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function mapEvent(ev){
  const startRaw = ev.start?.dateTime || ev.start?.date;
  const endRaw = ev.end?.dateTime || ev.end?.date;
  const allDay = !ev.start?.dateTime;
  const startD = new Date(startRaw);
  // pour un événement "jour entier", la date de fin Google est exclusive : on retire 1 jour
  let endD = new Date(endRaw);
  if(allDay) endD = new Date(endD.getTime() - 24*3600*1000);
  const priv = ev.extendedProperties?.private || {};
  return {
    id: ev.id,
    start: startRaw,
    end: endRaw,
    startD, endD, allDay,
    created: ev.created || '', // horodatage de création du RDV par Google Calendar (pas notre timestamp interne), sert à repérer les RDV sans empreinte au bout d'1h
    raw: ev.summary || '',
    done: priv[STATUS_KEY] === 'done',
    paused: priv[STATUS_KEY] === 'paused',
    inProgress: priv[STATUS_KEY] === 'cours',
    comment: priv[COMMENT_KEY] || '',
    perfBefore: priv[PERF_BEFORE_KEY] || '',
    perfAfter: priv[PERF_AFTER_KEY] || '',
    perf060Before: priv[PERF060_BEFORE_KEY] || '',
    perf060After: priv[PERF060_AFTER_KEY] || '',
    hpBefore: priv[PERF_HP_BEFORE_KEY] || '',
    hpAfter: priv[PERF_HP_AFTER_KEY] || '',
    torqueBefore: priv[PERF_TORQUE_BEFORE_KEY] || '',
    torqueAfter: priv[PERF_TORQUE_AFTER_KEY] || '',
    courtesyCar: priv[COURTESY_CAR_KEY] || '',
    conversation: ev.description || '',
    paymentStatus: priv[PAYMENT_STATUS_KEY] || '',
    stripeCustomerId: priv[STRIPE_CUSTOMER_KEY] || '',
    stripePaymentMethodId: priv[STRIPE_PM_KEY] || '',
    noShowCharged: priv[NOSHOW_CHARGED_KEY] === 'true',
    tarifBase: priv[TARIF_BASE_KEY] || '',
    tarifReductionPct: priv[TARIF_REDUCTION_KEY] || '',
    tarifManuel: priv[TARIF_MANUEL_KEY] || '',
    tarifFinal: priv[TARIF_FINAL_KEY] || '',
    isBlock: priv[BLOCK_TYPE_KEY] === 'blocage'
  };
}

// ---------- Dossiers à distance (mails avec fichier à traiter) ----------

let scanningGmail = false; // empêche deux scans Gmail de tourner en même temps (cause des doublons)

// Fusionne les dossiers en double (même id = même mail) qui ont pu être créés par un scan lancé
// deux fois en parallèle ou par deux appareils (PC/tablette) — garde le statut le plus avancé et
// le commentaire non vide s'il y en a un.
function dedupeRemoteTasks(tasks){
  const priorite = { done: 3, cours: 2, paused: 1, '': 0 };
  const parId = new Map();
  for(const t of tasks){
    const existant = parId.get(t.id);
    if(!existant){ parId.set(t.id, t); continue; }
    const fusion = { ...existant };
    if((priorite[t.status] || 0) > (priorite[existant.status] || 0)) fusion.status = t.status;
    if(!fusion.comment && t.comment) fusion.comment = t.comment;
    parId.set(t.id, fusion);
  }
  return [...parId.values()];
}

async function fetchRemoteTasks(){

    if(!res.ok){

      return;

    remoteTasks = dedupeRemoteTasks(await res.json());

    renderList();

}

function decodeBase64Url(data){
  try{
    const base64 = (data || '').replace(/-/g, '+').replace(/_/g, '/');
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }catch(e){ return ''; }
}

function parseGmailMessage(msg){
  const headers = msg.payload?.headers || [];
  const getHeader = (name) => (headers.find(h => h.name.toLowerCase() === name.toLowerCase())?.value || '');
  const subject = getHeader('Subject');
  const from = getHeader('From');
  const fromEmail = ((from.match(/<(.+?)>/) || [null, from])[1] || '').trim().toLowerCase();

  let bodyText = '';
  const attachments = [];
  (function walk(part){
    if(!part) return;
    if(part.filename && part.body?.attachmentId){
      attachments.push({ attachmentId: part.body.attachmentId, filename: part.filename });
    } else if(part.mimeType === 'text/plain' && part.body?.data){
      bodyText += decodeBase64Url(part.body.data);
    }
    (part.parts || []).forEach(walk);
  })(msg.payload);

  return {
    subject,
    fromEmail,
    bodyText: bodyText.trim(),
    attachments,
    receivedAt: new Date(parseInt(msg.internalDate, 10) || Date.now()).toISOString()
  };
}

async function scanGmailForNewTasks(){
  if(!config.remoteWorkerUrl || !config.remoteAccessKey){
    console.warn('[dossiers à distance] scan Gmail ignoré : non configuré');
    return;
  }
  if(scanningGmail){
    console.log('[dossiers à distance] scan déjà en cours, on ignore ce déclenchement');
    return;
  }
  scanningGmail = true;
  console.log('[dossiers à distance] scan Gmail en cours...');
  try{
    const fromQuery = REMOTE_SENDERS.map(e => `from:${e}`).join(' OR ');
    const q = encodeURIComponent(`(${fromQuery}) has:attachment newer_than:30d in:inbox`);
    const url = `https://gmail.googleapis.com/gmail/v1/users/me/messages?q=${q}&maxResults=30`;
    const res = await authFetch(url);
    if(!res.ok){
      console.error('[dossiers à distance] recherche Gmail : réponse HTTP', res.status, await res.text().catch(()=>''));
      return;
    }
    const data = await res.json();
    const messages = data.messages || [];
    console.log('[dossiers à distance] mails trouvés correspondant aux critères :', messages.length);
    const existingIds = new Set(remoteTasks.map(t => t.id));
    const newOnes = messages.filter(m => !existingIds.has(m.id));
    console.log('[dossiers à distance] dont nouveaux (pas encore importés) :', newOnes.length);
    if(newOnes.length === 0) return;

    let addedAny = false;
    for(const m of newOnes){
      const msgRes = await authFetch(`https://gmail.googleapis.com/gmail/v1/users/me/messages/${m.id}?format=full`);
      if(!msgRes.ok){
        console.error('[dossiers à distance] échec lecture du message', m.id, msgRes.status);
        continue;
      }
      const msg = await msgRes.json();
      const parsed = parseGmailMessage(msg);
      if(parsed.attachments.length === 0){
        console.log('[dossiers à distance] message', m.id, 'ignoré : aucune pièce jointe détectée dans le contenu');
        continue;
      }
      const primaryFile = parsed.attachments.find(a => /\.(mmf|zip)$/i.test(a.filename)) || parsed.attachments[0];
      remoteTasks.push({
        id: m.id,
        from: parsed.fromEmail,
        subject: parsed.subject,
        body: parsed.bodyText,
        receivedAt: parsed.receivedAt,
        attachments: parsed.attachments,
        tool: detectTool(primaryFile.filename),
        status: '',
        comment: ''
      });
      addedAny = true;
      console.log('[dossiers à distance] fiche ajoutée :', parsed.subject);
    }
    if(addedAny){
      remoteTasks = dedupeRemoteTasks(remoteTasks); // filet de sécurité final avant l'enregistrement
      remoteTasks.sort((a, b) => new Date(b.receivedAt) - new Date(a.receivedAt));
      await saveRemoteTasksToServer();
      playChime();
      renderList();
    }
  }catch(e){
    console.error('[dossiers à distance] scanGmailForNewTasks a échoué :', e);
  }finally{
    scanningGmail = false;
  }
}

async function downloadGmailAttachment(messageId, attachmentId, filename){
  try{
    const url = `https://gmail.googleapis.com/gmail/v1/users/me/messages/${messageId}/attachments/${attachmentId}`;
    const res = await authFetch(url);
    if(!res.ok){ alert("Impossible de récupérer le fichier pour le moment."); return; }
    const data = await res.json();
    const base64 = (data.data || '').replace(/-/g, '+').replace(/_/g, '/');
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for(let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: 'application/octet-stream' });
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = filename || 'fichier';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
  }catch(e){
    alert("Impossible de récupérer le fichier pour le moment.");
  }
}

// Récapitulatif PDF (imprimable) de TOUS les dossiers à distance reçus dans le mois en cours (mails
// de tes correspondants habituels, peu importe l'outil détecté — MMS ou Autotuner), avec la plaque
// de chaque véhicule extraite de l'objet du mail. Inclut TOUS les dossiers du mois (y compris ceux
// déjà marqués "fait"), pas seulement les dossiers encore actifs affichés dans la liste.
function printMonthlyRemoteTasksRecap(){
  const now = new Date();
  const debutMois = new Date(now.getFullYear(), now.getMonth(), 1);
  const finMois = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59, 999); // dernier jour du mois en cours

  const dossiers = remoteTasks
    .filter(t => {
      const d = new Date(t.receivedAt);
      return d >= debutMois && d <= finMois;
    })
    .sort((a, b) => new Date(a.receivedAt) - new Date(b.receivedAt));

  if(dossiers.length === 0){
    alert("Aucun dossier à distance reçu ce mois-ci.");
    return;
  }

  const moisLabel = now.toLocaleDateString('fr-FR', {month: 'long', year: 'numeric'});
  const dateStr = now.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});

  // Regroupe par correspondant (ordre stable = celui de REMOTE_SENDERS ; un expéditeur imprévu,
  // hors des 5 habituels, est placé à la fin plutôt qu'ignoré).
  const ordreSenders = [...REMOTE_SENDERS, ''];
  const groupes = {};
  dossiers.forEach(t => {
    const key = t.from || '';
    if(!groupes[key]) groupes[key] = [];
    groupes[key].push(t);
  });
  const correspondants = Object.keys(groupes).sort((a, b) => {
    let ia = ordreSenders.indexOf(a); if(ia === -1) ia = ordreSenders.length;
    let ib = ordreSenders.indexOf(b); if(ib === -1) ib = ordreSenders.length;
    return ia - ib || a.localeCompare(b);
  });

  const sections = correspondants.map(from => {
    const tasksFrom = groupes[from];
    const rows = tasksFrom.map(t => {
      const plaque = extractPlaque(t.subject) || '—';
      const dateLabel = new Date(t.receivedAt).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
      return `
        <tr>
          <td>${dateLabel}</td>
          <td class="plaque">${escapeHtml(plaque)}</td>
          <td>${escapeHtml(t.subject || '(sans objet)')}</td>
          <td>${escapeHtml(t.tool || '')}</td>
        </tr>
      `;
    }).join('');
    return `
      <h2>${escapeHtml(from || '(expéditeur inconnu)')} <span class="group-count">${tasksFrom.length} dossier${tasksFrom.length > 1 ? 's' : ''}</span></h2>
      <table>
        <thead><tr><th>Date</th><th>Plaque</th><th>Objet du mail</th><th>Outil</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }).join('');

  const html = `<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Récapitulatif dossiers à distance — ${escapeHtml(moisLabel)}</title>
<style>
  body{ font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; padding:40px; color:#1a1a1a; max-width:800px; margin:0 auto; }
  h1{ font-size:21px; margin:0 0 4px; }
  h2{ font-size:15px; margin:28px 0 6px; padding-top:14px; border-top:2px solid #1a1a1a; }
  .group-count{ font-weight:400; font-size:12px; color:#888; text-transform:none; }
  .sub{ color:#666; font-size:13px; margin-bottom:32px; }
  table{ width:100%; border-collapse:collapse; margin-top:6px; }
  th{ text-align:left; padding:10px 12px; background:#1a1a1a; color:#fff; font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  td{ padding:10px 12px; border-bottom:1px solid #ddd; font-size:14px; }
  td.plaque{ font-weight:700; font-family:'Courier New',monospace; letter-spacing:.05em; }
  tr:nth-child(even){ background:#f9f9f9; }
  .brand{ font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:#ff6a2b; font-weight:700; margin-bottom:8px; }
  .footer{ margin-top:28px; font-size:11px; color:#999; }
  @media print{ body{ padding:15px; } th{ -webkit-print-color-adjust:exact; print-color-adjust:exact; } h2{ break-after:avoid; } table{ break-inside:avoid; } }
</style>
</head>
<body>
  <div class="brand">AG Sport Reprog</div>
  <h1>Récapitulatif dossiers à distance — ${escapeHtml(moisLabel)}</h1>
  <div class="sub">Édité le ${dateStr} — ${dossiers.length} dossier${dossiers.length > 1 ? 's' : ''}, ${correspondants.length} correspondant${correspondants.length > 1 ? 's' : ''}</div>
  ${sections}
  <div class="footer">Plaque extraite automatiquement de l'objet du mail — à vérifier manuellement si affichée "—".</div>
  <script>window.onload = () => window.print();<\/script>

</html>`;

  const w = window.open('', '_blank');
  if(w){
    w.document.write(html);

  } else {
    alert("Le navigateur a bloqué l'ouverture de la fenêtre d'impression. Autorise les pop-ups pour ce site.");

// Retire un marqueur " <emoji> ...contenu..." du titre, sans toucher à l'AUTRE marqueur (courtoisie
// 🚗 ou tarif 💰) qui pourrait le suivre — nécessaire car les deux peuvent coexister dans le même
// titre d'événement (ordre choisi : tarif puis courtoisie), et chacun doit pouvoir être modifié
// indépendamment sans effacer l'autre.
function withoutMarker(title, emoji){
  const re = new RegExp(` ${emoji} [\\s\\S]*?(?= 🚗 | 💰 |$)`);
  return (title || '').replace(re, '');
}

function setCourtesyCar(id, value){
  const ev = events.find(e => e.id === id);
  const baseTitle = withoutMarker(ev ? ev.raw : '', '🚗'); // retire un ancien marqueur de courtoisie s'il existe, garde le tarif
  const newTitle = value ? `${baseTitle} 🚗 ${COURTESY_CARS[value]}` : baseTitle;
  // colorId "6" = Tangerine (orange) dans Google Agenda ; null = remet la couleur par défaut
  patchPrivateProps(id, { [COURTESY_CAR_KEY]: value }, value ? '6' : null, newTitle);
}

// Reconstruit le titre avec le marqueur tarif (💰) inséré juste avant un marqueur de courtoisie
// existant (🚗), ou en fin de titre s'il n'y en a pas — pour que l'ordre reste toujours cohérent.
function buildTitleWithTarif(rawTitle, tarifFinal){
  const sansTarif = withoutMarker(rawTitle, '💰');
  if(!tarifFinal) return sansTarif;
  const marker = ` 💰 ${tarifFinal}€`;
  const idxCourtoisie = sansTarif.indexOf(' 🚗 ');
  return idxCourtoisie === -1 ? (sansTarif + marker) : (sansTarif.slice(0, idxCourtoisie) + marker + sansTarif.slice(idxCourtoisie));
}

// Calcule le tarif final à partir des trois valeurs stockées : le manuel est toujours prioritaire
// s'il est renseigné, sinon on applique la réduction % au tarif de base choisi dans la liste.
function calculerTarifFinal(base, reductionPct, manuel){
  if(manuel !== '' && manuel !== null && manuel !== undefined && !isNaN(manuel)) return Math.round(Number(manuel) * 100) / 100;
  const b = Number(base) || 0;
  const r = Number(reductionPct) || 0;
  return Math.round(b * (1 - r / 100) * 100) / 100;
}

async function createCalendarEvent({nom, voiture, presta, numero, commentaire, courtesy, tarifBase, tarifReductionPct, tarifManuel, date, startTime, endTime, isMultiDay, endDate}){
  const modelPart = [nom, voiture].filter(Boolean).join(' ').trim();
  let summary = [modelPart, presta, numero].filter(Boolean).join(' | ');
  const tarifFinal = calculerTarifFinal(tarifBase, tarifReductionPct, tarifManuel);
  // Ordre du titre : tarif (💰) avant courtoisie (🚗), toujours cohérent avec buildTitleWithTarif/withoutMarker.
  if(tarifFinal) summary += ` 💰 ${tarifFinal}€`;
  if(courtesy) summary += ` 🚗 ${COURTESY_CARS[courtesy]}`;
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(config.calendarId)}/events`;

  let body;
  if(isMultiDay){
    // Google Agenda attend une date de fin exclusive : on ajoute 1 jour au dernier jour choisi
    const endExclusive = new Date(endDate + 'T00:00:00');
    endExclusive.setDate(endExclusive.getDate() + 1);
    const endExclusiveStr = `${endExclusive.getFullYear()}-${String(endExclusive.getMonth()+1).padStart(2,'0')}-${String(endExclusive.getDate()).padStart(2,'0')}`;
    body = {
      summary,
      start: { date: date },
      end: { date: endExclusiveStr }
    };
  } else {
    body = {
      summary,
      start: { dateTime: `${date}T${startTime}:00`, timeZone: 'Europe/Paris' },
      end: { dateTime: `${date}T${endTime}:00`, timeZone: 'Europe/Paris' }
    };
  }

  const res = await authFetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    alert("Impossible de créer le rendez-vous. Réessaie dans quelques instants.");
    return false;
  }
  const created = await res.json();
  if(commentaire || courtesy || tarifFinal){
    await patchPrivateProps(created.id, {
      [COMMENT_KEY]: commentaire || '',
      [COURTESY_CAR_KEY]: courtesy || '',
      [TARIF_BASE_KEY]: tarifBase || '',
      [TARIF_REDUCTION_KEY]: tarifReductionPct || '',
      [TARIF_MANUEL_KEY]: tarifManuel || '',
      [TARIF_FINAL_KEY]: tarifFinal ? String(tarifFinal) : ''
    }, courtesy ? '6' : undefined);
  }
  return created.id;
}

// Crée un blocage de créneau (fermeture exceptionnelle, formation, vacances...) : un événement Google
// Agenda normal, marqué atelier_type=blocage, qui rend le créneau indisponible pour l'assistant IA
// (côté public-booking-api : bloque tout le jour pour les grosses prestations Stage1/Flexfuel — pas de
// granularité demi-journée possible pour celles-ci — et bloque précisément la plage choisie pour le
// diagnostic rapide 30 min). Toujours en dateTime (jamais un événement "jour entier" Google), même pour
// une journée complète, pour rester compatible avec le scan par horaires de check_creneaux_diagnostic.
async function createBlockEvent({date, label, fullDay, startTime, endTime}){
  const summary = `🚫 ${label || 'Atelier fermé'}`;
  const debut = fullDay ? '08:00' : startTime;
  const fin = fullDay ? '19:00' : endTime;
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(config.calendarId)}/events`;
  const body = {
    summary,
    start: { dateTime: `${date}T${debut}:00`, timeZone: 'Europe/Paris' },
    end: { dateTime: `${date}T${fin}:00`, timeZone: 'Europe/Paris' }
  };
  const res = await authFetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    alert("Impossible de créer le blocage. Réessaie dans quelques instants.");
    return false;
  }
  const created = await res.json();
  await patchPrivateProps(created.id, { [BLOCK_TYPE_KEY]: 'blocage' });
  return created.id;
}

async function deleteBlockEvent(id){
  if(!confirm('Supprimer ce blocage ? Le créneau redeviendra disponible pour les rendez-vous.')) return;
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(config.calendarId)}/events/${id}`;

  if(!res.ok && res.status !== 410){
    alert('Impossible de supprimer ce blocage. Réessaie dans quelques instants.');

  }
  fetchEvents();
}

// Récupère le suffixe de marqueurs (💰 tarif, puis 🚗 courtoisie) déjà présent à la fin du titre
// d'un événement, tel quel, pour pouvoir le recoller après une modification des champs de base
// (client/véhicule, prestation, numéro) sans jamais perdre le tarif ou le véhicule de courtoisie déjà
// enregistrés — les deux ont leur propre bouton d'édition dédié, ce n'est pas ce formulaire qui les gère.
function extractMarkersSuffix(raw){
  const sansMarkers = withoutMarker(withoutMarker(raw || '', '🚗'), '💰');
  return (raw || '').slice(sansMarkers.length);
}

// Modifie les champs de base d'un rendez-vous déjà créé (client/véhicule, prestation, numéro, date,
// horaires ou garde plusieurs jours) — contrairement à createCalendarEvent (POST, nouvel événement),
// ceci est un PATCH sur l'événement existant : son id, son commentaire, son tarif, sa voiture de
// courtoisie et sa conversation liée restent inchangés.
async function updateEventDetails(id, {summary, date, startTime, endTime, isMultiDay, endDate}){
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(config.calendarId)}/events/${id}`;
  const body = { summary };
  if(isMultiDay){
    const endExclusive = new Date(endDate + 'T00:00:00');
    endExclusive.setDate(endExclusive.getDate() + 1);
    const endExclusiveStr = `${endExclusive.getFullYear()}-${String(endExclusive.getMonth()+1).padStart(2,'0')}-${String(endExclusive.getDate()).padStart(2,'0')}`;
    body.start = { date: date };
    body.end = { date: endExclusiveStr };
  } else {
    body.start = { dateTime: `${date}T${startTime}:00`, timeZone: 'Europe/Paris' };
    body.end = { dateTime: `${date}T${endTime}:00`, timeZone: 'Europe/Paris' };
  }
  const res = await authFetch(url, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    alert("Impossible de modifier le rendez-vous. Réessaie dans quelques instants.");
    return false;
  }
  fetchEvents();
  return true;
}

// Estimation du prix (TTC) d'une prestation à partir de mots-clés dans le titre — utilisée par le
// bouton "Absent" pour calculer le montant du prélèvement de 10% en cas de rendez-vous non honoré.
const REVENUE_KEYWORDS = [
  { keywords: ['egr'], priceTTC: 180 },
  { keywords: ['fap'], priceTTC: 180 },
  { keywords: ['adblue'], priceTTC: 350 },
  { keywords: ['flexfuel', 'ethanol', 'éthanol', 'e85', 'flex'], priceTTC: 690 },
  { keywords: ['banc'], priceTTC: 120 },
  { keywords: ['puissance', 'reprog'], priceTTC: 500 }
];
function estimateRevenueTTC(title){
  const t = (title || '').toLowerCase();

  // 1. Cherche d'abord un montant écrit noir sur blanc dans le titre (plus fiable qu'une estimation par mot-clé)
  const priceMatch = t.match(/(\d{2,5})(?:[.,](\d{1,2}))?\s*(?:€|(?:eur|euros?)\b)/);
  if(priceMatch){
    const entier = parseInt(priceMatch[1], 10);
    const decimales = priceMatch[2] ? parseInt(priceMatch[2], 10) / 100 : 0;
    return entier + decimales;
  }

  // 2. Sinon, additionne le prix de CHAQUE prestation du catalogue reconnue dans le titre — un
  // rendez-vous combiné (ex : "EGR + FAP + ADBLUE") doit compter la somme des prestations reconnues,
  // pas seulement la première trouvée, sinon on sous-estime lourdement le CA réel de la journée.
  let total = 0;
  for(const entry of REVENUE_KEYWORDS){
    if(entry.keywords.some(k => t.includes(k))) total += entry.priceTTC;
  }
  return total;
}

// Calcule le jour et l'heure de remise suggérés pour un véhicule gardé plusieurs jours : dépôt
// avant 15h30 -> prêt le jour ouvré suivant à 10:15. Dépôt à 15h30 ou après -> prêt le jour ouvré
// suivant à l'heure de fermeture de ce jour-là (le travail se fait alors le lendemain). Si le jour
// suivant tombe un samedi/dimanche, avance jusqu'au prochain jour ouvré. Juste une suggestion pour
// pré-remplir le champ — reste librement modifiable à la main.
function calculerRemiseSuggeree(dateDepotStr, heureDepot){
  const [h, m] = (heureDepot || '00:00').split(':').map(Number);
  const minutesDepot = (h || 0) * 60 + (m || 0);
  const SEUIL = 15 * 60 + 30; // 15h30
  const FERMETURE = { 1: 18 * 60, 2: 18 * 60, 3: 18 * 60, 4: 18 * 60, 5: 17 * 60 }; // lun-jeu 18h, ven 17h

  let d = new Date(dateDepotStr + 'T00:00:00');
  d.setDate(d.getDate() + 1);
  while(d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1); // saute samedi/dimanche

  let heureRemise;
  if(minutesDepot < SEUIL){
    heureRemise = '10:15';
  } else {
    const fermetureMin = FERMETURE[d.getDay()] || 18 * 60;
    heureRemise = `${String(Math.floor(fermetureMin / 60)).padStart(2, '0')}:${String(fermetureMin % 60).padStart(2, '0')}`;
  }
  return heureRemise;
}

            <input id="newDate" type="date" value="${today}">
          </div>

          <label class="checkbox-row" style="margin-top:0; margin-bottom:14px;">
            <input type="checkbox" id="newMultiDay"> Garder le véhicule plusieurs jours
          </label>

          <div id="singleDayFields">
            <div class="field required">
              <label>Heure de début</label>
              <input id="newStartTime" type="time" value="09:00">
            </div>
            <div class="field required">
              <label>Heure de fin</label>
              <input id="newEndTime" type="time" value="10:00">
            </div>
          </div>
          <div id="multiDayFields" style="display:none;">
            <div class="field required">
              <label>Jusqu'au (dernier jour inclus)</label>
              <input id="newEndDate" type="date" value="${today}">
            </div>
            <div class="field">
              <label>Heure d'arrivée (optionnel)</label>
              <input id="newMultiArrival" type="time">
            </div>
            <div class="field">
              <label>Heure de départ prévue (optionnel)</label>
              <input id="newMultiDeparture" type="time">
            </div>
          </div>

          <div class="field">
            <label>Commentaires</label>
            <textarea id="newComment" placeholder="optionnel"></textarea>
          </div>
          <div class="field">
            <label>Véhicule de courtoisie prêté</label>
            <select id="newCourtesy">${buildCourtesyOptionsHtml(new Set(), '')}</select>
          </div>
        </div>
        <div class="newevent-right">
          <span class="mc-loading" id="mcLoading">Chargement du planning du mois...</span>
          <div class="month-summary" id="monthSummary"></div>
          <div class="mini-cal" id="miniCal"></div>
          <div id="dayAgendaPanel" style="margin-top:20px;"><div class="search-hint">Chargement du planning...</div></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelNewEvent">Annuler</button>
        <button class="btn-save" id="saveNewEvent">Créer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  document.getElementById('cancelNewEvent').onclick = () => overlay.remove();

  function windowDates(){
    const base = new Date();
    const start = new Date(base.getFullYear(), base.getMonth(), base.getDate() + dayOffset * 30);
    const days = [];
    for(let i = 0; i < 30; i++){
      days.push(new Date(start.getFullYear(), start.getMonth(), start.getDate() + i));
    }
    return days;
  }

  function renderMonthSummary(){
    const days = windowDates();
    let totalRdv = 0;
    let freeDays = 0;
    days.forEach(dateObj => {
      const dateStr = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
      const count = countsByDate[dateStr] || 0;
      totalRdv += count;
      if(count === 0) freeDays++;
    });
    const summaryEl = document.getElementById('monthSummary');
    if(summaryEl){
      summaryEl.innerHTML = `
        <div class="pill"><b>${totalRdv}</b> véhicule${totalRdv > 1 ? 's' : ''} sur ces 30 jours</div>
        <div class="pill"><b>${freeDays}</b> jour${freeDays > 1 ? 's' : ''} encore libre${freeDays > 1 ? 's' : ''}</div>
      `;
    }
  }

  function renderMiniCal(){
    const days = windowDates();
    const startWeekday = (days[0].getDay() + 6) % 7; // lundi = 0
    const rangeLabel = `${days[0].toLocaleDateString('fr-FR', {day:'numeric', month:'short'})} → ${days[29].toLocaleDateString('fr-FR', {day:'numeric', month:'short'})}`;

    let cells = '';
    for(let i = 0; i < startWeekday; i++) cells += `<div class="mc-cell mc-empty"></div>`;
    days.forEach(dateObj => {
      const dateStr = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
      const count = countsByDate[dateStr] || 0;
      const isSelected = dateStr === selectedDate;
      const dayNum = dateObj.getDate();
      const monthShort = dateObj.toLocaleDateString('fr-FR', {month:'short'});
      cells += `<div class="mc-cell ${isSelected ? 'mc-selected' : ''} ${count > 0 ? 'mc-busy' : ''}" data-date="${dateStr}">
        <span class="mc-day">${dayNum}<small>${monthShort}</small></span>${count > 0 ? `<span class="mc-count">${count}</span>` : ''}
      </div>`;
    });

    document.getElementById('miniCal').innerHTML = `
      <div class="mc-header">
        <button type="button" class="mc-nav" id="mcPrev" ${dayOffset <= 0 ? 'disabled' : ''}>‹</button>
        <span class="mc-title">${rangeLabel}</span>
        <button type="button" class="mc-nav" id="mcNext">›</button>
      </div>
      <div class="mc-weekdays"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="mc-grid">${cells}</div>
    `;
    document.getElementById('mcPrev').onclick = () => { if(dayOffset > 0){ dayOffset--; renderMiniCal(); renderMonthSummary(); } };
    document.getElementById('mcNext').onclick = () => { dayOffset++; renderMiniCal(); renderMonthSummary(); };
    document.querySelectorAll('.mc-cell:not(.mc-empty)').forEach(el => {
      el.onclick = () => {
        selectedDate = el.dataset.date;
        // Changer .value par JS ne déclenche pas l'événement "change" du champ date — on doit donc
        // rappeler nous-mêmes tout ce qui en dépend normalement (dispo courtoisie, suggestion d'heure
        // de départ), sinon ça reste calculé sur l'ancienne date choisie.
        document.getElementById('newDate').value = selectedDate;
        renderMiniCal();
        renderDayAgenda();
        refreshCourtesyAvailability();
        suggererHeureDepart();
      };
    });
  }

  function renderDayAgenda(){
    const panel = document.getElementById('dayAgendaPanel');
    if(!panel) return;
    const selD = new Date(selectedDate + 'T00:00:00');
    const dayEvents = allUpcomingEvents
      .filter(ev => {
        if(ev.isMultiDay){
          const startD = new Date(ev.start + 'T00:00:00');
          const endD = new Date(ev.end); // borne exclusive
          return selD >= startD && selD < endD;
        }
        return ev.dateStr === selectedDate;
      })
      .sort((a, b) => (a.start || '').localeCompare(b.start || ''));
    const dateLabel = new Date(selectedDate + 'T00:00:00').toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'});

    if(dayEvents.length === 0){
      panel.innerHTML = `<div class="day-agenda-title">${dateLabel}</div><div class="search-hint">Aucun rendez-vous ce jour — journée libre.</div>`;
      return;
    }
    panel.innerHTML = `
      <div class="day-agenda-title">${dateLabel} — ${dayEvents.length} RDV déjà pris</div>
      ${dayEvents.map(ev => {
        const parts = parseParts(ev.raw);
        const label = parts ? `${parts.model} — ${parts.presta}` : ev.raw;
        const timeLabel = ev.allDay ? (ev.isMultiDay ? 'Plsrs jours' : 'Jour entier') : `${fmtTime(ev.start)} → ${fmtTime(ev.end)}`;
        const courtesyTag = ev.courtesyCar ? `<span class="sr-courtesy">🚗 ${escapeHtml(COURTESY_CARS[ev.courtesyCar] || ev.courtesyCar)}</span>` : '';
        return `
          <div class="search-result ${ev.isMultiDay ? 'multiday' : ''}">
            <div class="sr-date">${timeLabel}</div>
            <div class="sr-body"><div class="sr-title">${escapeHtml(label)}</div>${courtesyTag}</div>
          </div>
        `;
      }).join('')}
    `;
  }

  document.getElementById('newDate').addEventListener('change', (e) => {
    selectedDate = e.target.value;
    renderMiniCal();
    renderDayAgenda();
    const endDateInput = document.getElementById('newEndDate');
    if(endDateInput){
      endDateInput.min = e.target.value;
      if(endDateInput.value < e.target.value) endDateInput.value = e.target.value;
    }
  });

  document.getElementById('newMultiDay').addEventListener('change', (e) => {
    document.getElementById('singleDayFields').style.display = e.target.checked ? 'none' : '';
    document.getElementById('multiDayFields').style.display = e.target.checked ? '' : 'none';
    refreshCourtesyAvailability();
  });

  // Disponibilité des voitures de courtoisie POUR LA DATE CHOISIE dans le formulaire (ex : le 20
  // novembre), pas pour aujourd'hui — on se base donc sur allUpcomingEvents (RDV des 3 prochains
  // mois, chargés plus bas pour le mini-calendrier) plutôt que sur la liste `events` globale, qui
  // ne contient que les quelques jours actuellement affichés dans le Planning.
  function getBusyCourtesyKeysFromUpcoming(dateFrom, dateTo){
    const to = dateTo || dateFrom;
    const busy = new Set();
    allUpcomingEvents.forEach(ev => {
      if(!ev.courtesyCar) return;
      // Comparaison en texte AAAA-MM-JJ (triable directement) plutôt qu'avec des objets Date qui
      // incluent une heure/fuseau — on évite ainsi tout décalage d'un jour selon l'heure locale.
      let debut = ev.dateStr;
      let fin = ev.dateStr;
      if(ev.isMultiDay){
        debut = ev.start.slice(0, 10);
        // ev.end est la borne EXCLUSIVE fournie par Google (le lendemain du dernier jour réel) —
        // on retire un jour pour obtenir le dernier jour réellement occupé par le véhicule.
        const finExclusive = new Date(ev.end.slice(0, 10) + 'T00:00:00');
        finExclusive.setDate(finExclusive.getDate() - 1);
        fin = dayKey(finExclusive);
      }
      if(debut <= to && fin >= dateFrom) busy.add(ev.courtesyCar);
    });
    return busy;
  }

  function refreshCourtesyAvailability(){
    const sel = document.getElementById('newCourtesy');
    const currentValue = sel.value;
    const isMulti = document.getElementById('newMultiDay').checked;
    const dateFrom = document.getElementById('newDate').value;
    const dateTo = isMulti ? document.getElementById('newEndDate').value : dateFrom;
    if(!dateFrom) return;
    sel.innerHTML = buildCourtesyOptionsHtml(getBusyCourtesyKeysFromUpcoming(dateFrom, dateTo), currentValue);
  }
  document.getElementById('newDate').addEventListener('change', refreshCourtesyAvailability);
  document.getElementById('newEndDate').addEventListener('change', refreshCourtesyAvailability);

  function suggererHeureDepart(){
    const dateDepot = document.getElementById('newDate').value;
    const heureDepot = document.getElementById('newMultiArrival').value;
    if(!dateDepot || !heureDepot) return;
    document.getElementById('newMultiDeparture').value = calculerRemiseSuggeree(dateDepot, heureDepot);
  }
  document.getElementById('newMultiArrival').addEventListener('change', suggererHeureDepart);
  document.getElementById('newDate').addEventListener('change', suggererHeureDepart);

  const newTarifSelectEl = document.getElementById('newTarifSelect');
  const newTarifReductionEl = document.getElementById('newTarifReduction');
  const newTarifManuelEl = document.getElementById('newTarifManuel');
  const newTarifApercuEl = document.getElementById('newTarifApercu');
  const rafraichirNewTarifApercu = () => {
    const final = calculerTarifFinal(newTarifSelectEl.value, newTarifReductionEl.value, newTarifManuelEl.value);
    newTarifApercuEl.textContent = final ? `${final.toFixed(2).replace(/\.00$/, '')} € TTC` : '—';
  };
  newTarifSelectEl.onchange = rafraichirNewTarifApercu;
  newTarifReductionEl.oninput = rafraichirNewTarifApercu;
  newTarifManuelEl.oninput = rafraichirNewTarifApercu;

  renderMiniCal();
  renderDayAgenda();

  // Charge les rendez-vous des 3 prochains mois : compte par jour + détail pour le jour sélectionné
  try{
    const timeMin = now.toISOString();
    const timeMax = new Date(now.getFullYear(), now.getMonth() + 3, now.getDate()).toISOString();
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(config.calendarId)}/events?singleEvents=true&orderBy=startTime&maxResults=2500&timeMin=${timeMin}&timeMax=${timeMax}`;
    const res = await authFetch(url);
    if(res.ok){
      const data = await res.json();
      allUpcomingEvents = (data.items || []).map(ev => {
        const startRaw = ev.start?.dateTime || ev.start?.date;
        const endRaw = ev.end?.dateTime || ev.end?.date;
        const allDay = !ev.start?.dateTime;
        const isMultiDay = allDay && endRaw && startRaw && (new Date(endRaw) - new Date(startRaw)) > 24 * 3600 * 1000;
        return {
          id: ev.id,
          start: startRaw,
          end: endRaw,
          allDay,
          isMultiDay,
          raw: ev.summary || '',
          dateStr: (startRaw || '').slice(0, 10),
          courtesyCar: ev.extendedProperties?.private?.[COURTESY_CAR_KEY] || ''
        };
      });
      countsByDate = {};
      allUpcomingEvents.forEach(ev => {
        if(ev.isMultiDay){
          let d = new Date(ev.start + 'T00:00:00');
          const endD = new Date(ev.end);
          while(d < endD){
            const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            countsByDate[key] = (countsByDate[key] || 0) + 1;
            d.setDate(d.getDate() + 1);
          }
        } else {
          countsByDate[ev.dateStr] = (countsByDate[ev.dateStr] || 0) + 1;
        }
      });
    }
  }catch(e){}
  const loadingEl = document.getElementById('mcLoading');
  if(loadingEl) loadingEl.remove();
  renderMiniCal();
  renderMonthSummary();
  renderDayAgenda();
  refreshCourtesyAvailability(); // les RDV des 3 prochains mois viennent d'arriver : on recalcule la dispo courtoisie pour la date déjà sélectionnée

  document.getElementById('saveNewEvent').onclick = async () => {
    const nom = document.getElementById('newNom').value.trim();
    const voiture = document.getElementById('newVoiture').value.trim();
    const presta = document.getElementById('newPresta').value.trim();
    const numero = document.getElementById('newNumero').value.trim();
    let commentaire = document.getElementById('newComment').value.trim();
    const courtesy = document.getElementById('newCourtesy').value;
    const tarifBase = document.getElementById('newTarifSelect').value;
    const tarifReductionPct = document.getElementById('newTarifReduction').value;
    const tarifManuel = document.getElementById('newTarifManuel').value;
    const date = document.getElementById('newDate').value;
    const isMultiDay = document.getElementById('newMultiDay').checked;
    const startTime = document.getElementById('newStartTime').value;
    const endTime = document.getElementById('newEndTime').value;
    const endDate = document.getElementById('newEndDate').value;
    const multiArrival = document.getElementById('newMultiArrival').value;
    const multiDeparture = document.getElementById('newMultiDeparture').value;
    if(!nom || !voiture || !date){
      alert('Renseigne au moins le nom, la voiture et la date.');
      return;
    }
    if(isMultiDay && !endDate){
      alert('Renseigne le dernier jour de garde du véhicule.');
      return;
    }
    if(isMultiDay && endDate < date){
      alert('La date "Jusqu\'au" est avant la date de début : corrige la date de fin avant d\'enregistrer.');
      return;
    }
    if(!isMultiDay && (!startTime || !endTime)){
      alert('Renseigne les horaires de début et de fin.');
      return;
    }
    if(isMultiDay && (multiArrival || multiDeparture)){
      // L'événement reste "journée entière" dans l'agenda (aucun changement pour le calcul de
      // disponibilité ailleurs) — les heures précises sont juste notées dans le commentaire.
      const notes = [];
      if(multiArrival) notes.push(`Dépôt à ${multiArrival}`);
      if(multiDeparture) notes.push(`récupération prévue à ${multiDeparture}`);
      const noteHoraires = notes.join(', ') + '.';
      commentaire = commentaire ? `${noteHoraires} ${commentaire}` : noteHoraires;
    }
    const saveBtn = document.getElementById('saveNewEvent');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Création...';
    const ok = await createCalendarEvent({nom, voiture, presta, numero, commentaire, courtesy, tarifBase, tarifReductionPct, tarifManuel, date, startTime, endTime, isMultiDay, endDate});
    if(ok){
      overlay.remove();
      fetchEvents();
    } else {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Créer';
    }
  };
}

function printPerfReport(ev){
  const before = ev.perfBefore || '';
  const after = ev.perfAfter || '';
  const before060 = ev.perf060Before || '';
  const after060 = ev.perf060After || '';
  const gainOf = (b, a) => {
    const bn = parseFloat((b || '').replace(',', '.'));
    const an = parseFloat((a || '').replace(',', '.'));
    return (!isNaN(bn) && !isNaN(an)) ? `${(bn - an).toFixed(2)} s` : '—';
  };
  const gainPlusOf = (b, a, unit) => {
    const bn = parseFloat((b || '').replace(',', '.'));
    const an = parseFloat((a || '').replace(',', '.'));
    return (!isNaN(bn) && !isNaN(an)) ? `+${(an - bn).toFixed(0)} ${unit}` : '—';
  };
  const dateStr = new Date().toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});

  const rows060 = (before060 || after060) ? `
    <tr><td class="label">0-60 km/h d'origine</td><td>${escapeHtml(before060 || '—')}</td></tr>
    <tr><td class="label">0-60 km/h après reprogrammation</td><td>${escapeHtml(after060 || '—')}</td></tr>
    <tr class="gain-row"><td class="label">Gain 0-60</td><td>${gainOf(before060, after060)}</td></tr>
  ` : '';

  const rowsPower = (ev.hpBefore || ev.hpAfter || ev.torqueBefore || ev.torqueAfter) ? `
    <tr><td class="label">Puissance d'origine (approx.)</td><td>${escapeHtml(ev.hpBefore || '—')} ch</td></tr>
    <tr><td class="label">Puissance après reprogrammation (approx.)</td><td>${escapeHtml(ev.hpAfter || '—')} ch</td></tr>
    <tr class="gain-row"><td class="label">Gain puissance</td><td>${gainPlusOf(ev.hpBefore, ev.hpAfter, 'ch')}</td></tr>
    <tr><td class="label">Couple d'origine (approx.)</td><td>${escapeHtml(ev.torqueBefore || '—')} Nm</td></tr>
    <tr><td class="label">Couple après reprogrammation (approx.)</td><td>${escapeHtml(ev.torqueAfter || '—')} Nm</td></tr>
    <tr class="gain-row"><td class="label">Gain couple</td><td>${gainPlusOf(ev.torqueBefore, ev.torqueAfter, 'Nm')}</td></tr>
  ` : '';

  const html = `<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Rapport de performance</title>
<style>
  body{ font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; padding:40px; color:#1a1a1a; max-width:650px; margin:0 auto; }
  h1{ font-size:21px; margin:0 0 4px; }
  .sub{ color:#666; font-size:13px; margin-bottom:32px; }
  table{ width:100%; border-collapse:collapse; margin-top:10px; }
  td{ padding:14px 16px; border:1px solid #ddd; font-size:15px; }
  td.label{ background:#f4f4f4; font-weight:600; width:50%; }
  tr.gain-row td{ background:#ff6a2b; color:#fff; font-weight:700; }
  tr.gain-row td.label{ background:#e55a1c; }
  .brand{ font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:#ff6a2b; font-weight:700; margin-bottom:8px; }
  .footer{ margin-top:36px; font-size:11px; color:#999; line-height:1.5; }
  @media print{ body{ padding:15px; } tr.gain-row td{ -webkit-print-color-adjust:exact; print-color-adjust:exact; } }
</style>
</head>
<body>
  <div class="brand">AG Sport Reprog</div>
  <h1>Rapport de performance — Augmentation de puissance</h1>
  <div class="sub">Édité le ${dateStr}</div>
  <table>
    ${rows060}
    <tr><td class="label">0-100 km/h d'origine</td><td>${escapeHtml(before || '—')}</td></tr>
    <tr><td class="label">0-100 km/h après reprogrammation</td><td>${escapeHtml(after || '—')}</td></tr>
    <tr class="gain-row"><td class="label">Gain 0-100</td><td>${gainOf(before, after)}</td></tr>
    ${rowsPower}
  </table>
  <div class="footer">Mesures effectuées à l'aide d'un récepteur GPS (Dragy ou équivalent). Valeurs de puissance et couple approximatives (estimation atelier, non certifiées banc de puissance). Résultats donnés à titre indicatif, pouvant varier selon les conditions (météo, revêtement, charge du véhicule).</div>
  <script>window.onload = () => window.print();<\/script>
</body>
</html>`;

  const w = window.open('', '_blank');
  if(w){
    w.document.write(html);
    w.document.close();
  } else {
    alert("Le navigateur a bloqué l'ouverture de la fenêtre d'impression. Autorise les pop-ups pour ce site.");
  }
}

      torqueAfter: document.getElementById('torqueAfterInput').value.trim()
    };
    overlay.remove();
    setPerf(id, values);
  };
}

function parseParts(raw){
  const cleaned = withoutMarker(withoutMarker(raw || '', '🚗'), '💰');
  const parts = cleaned.split('|').map(s => s.trim()).filter(Boolean);
  if(parts.length >= 2){
    return { model: parts[0], presta: parts[1] || '', phone: parts[2] || '' };
  }
  return null;
}

function fmtTime(dtStr){
  if(!dtStr) return '--:--';
  if(dtStr.length === 10) return 'Jour';
  const d = new Date(dtStr);
  return d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
}

function fmtRange(ev){
  if(ev.allDay) return 'Jour';
  const start = fmtTime(ev.start);
  const end = fmtTime(ev.end);
  return `${start}<span class="arrow">→</span>${end}`;
}

// Rendez-vous dont l'empreinte bancaire n'a pas été confirmée plus d'1h après la création du RDV
// (créé le = horodatage Google Calendar, pas notre timestamp interne côté Stripe, pour que ça
// remonte même si l'empreinte n'a jamais été lancée). Purement informatif : ne supprime ni ne
// modifie rien, juste une liste consultable via le badge.
function getEventsSansEmpreinte(){
  const seuilMs = 60 * 60 * 1000; // 1h
  return events
    .filter(ev => ev.paymentStatus !== 'confirme' && ev.created && (Date.now() - new Date(ev.created).getTime()) > seuilMs)
    .sort((a, b) => new Date(a.created) - new Date(b.created));
}

function openSansEmpreinteModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const liste = getEventsSansEmpreinte();
  const rowsHtml = liste.map(ev => {
    const parts = parseParts(ev.raw);
    const heures = Math.floor((Date.now() - new Date(ev.created).getTime()) / 3600000);
    const dateAffichage = ev.startD.toLocaleDateString('fr-FR', {weekday:'short', day:'numeric', month:'short'});
    const heureAffichage = ev.allDay ? '' : ev.startD.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    return `
      <div class="sans-empreinte-row">
        <div class="sr-info">
          <div class="sr-model">${escapeHtml(parts ? parts.model : ev.raw)}</div>
          <div class="sr-meta">${dateAffichage}${heureAffichage ? ' à ' + heureAffichage : ''} · créé il y a ${heures}h</div>
        </div>
        <div class="comment-btn empreinte-btn-modal" data-id="${ev.id}" data-nom="${encodeURIComponent(ev.raw || '')}">🔒 Empreinte</div>
      </div>`;
  }).join('');
  overlay.innerHTML = `
    <div class="modal">
      <h3>Sans empreinte bancaire (+1h)</h3>
      ${liste.length === 0 ? '<div class="field"><label>Aucun rendez-vous concerné.</label></div>' : `<div class="sans-empreinte-list">${rowsHtml}</div>`}
      <div class="modal-actions">
        <button class="btn-cancel" id="closeSansEmpreinte">Fermer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  document.getElementById('closeSansEmpreinte').onclick = () => overlay.remove();
  overlay.querySelectorAll('.empreinte-btn-modal').forEach(el => {
    el.onclick = () => {
      const id = el.dataset.id;
      const nom = decodeURIComponent(el.dataset.nom);
      overlay.remove();
      openEmpreinteModal(id, nom);
    };
  });
}

// Grille du mois affiché en vue calendrier : 6 semaines entières (42 jours, toujours assez pour
// n'importe quel mois), chaque jour cliquable pour sauter directement dessus dans la liste — c'est
// ce qui permet de retrouver en 2 clics un RDV pris loin dans le temps (ex : fin du mois prochain)
// sans scroller jour par jour depuis aujourd'hui.
function buildCalendarGridHtml(){
  const todayKey = dayKey(new Date());
  const nomMois = calendrierMonth.toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
  const debutGrille = mondayOfWeek(calendrierMonth);

  const cellules = [];
  for(let i = 0; i < 42; i++){
    const d = new Date(debutGrille.getFullYear(), debutGrille.getMonth(), debutGrille.getDate() + i);
    const key = dayKey(d);
    const dEnd = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23,59,59);
    const dayEvents = events.filter(ev => ev.startD <= dEnd && ev.endD >= d && !ev.paused);
    const hasBlock = dayEvents.some(ev => ev.isBlock);
    const rdvCount = dayEvents.filter(ev => !ev.isBlock).length;
    cellules.push({
      key,
      jourNum: d.getDate(),
      rdvCount,
      hasBlock,
      horsMois: d.getMonth() !== calendrierMonth.getMonth(),
      isToday: key === todayKey
    });
  }

  const enTetes = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(j => `<div class="cal-weekday">${j}</div>`).join('');
  const jours = cellules.map(c => `
    <div class="cal-cell ${c.horsMois ? 'cal-outside' : ''} ${c.isToday ? 'cal-today' : ''} ${c.rdvCount > 0 ? 'cal-has-events' : ''}" data-date="${c.key}">
      <div class="cal-daynum">${c.jourNum}</div>
      ${c.rdvCount > 0 ? `<div class="cal-count">${c.rdvCount}</div>` : ''}
      ${c.hasBlock ? `<div class="cal-block-tag">🚫</div>` : ''}
    </div>
  `).join('');

  return `
    <div class="cal-wrap">
      <div class="cal-nav">
        <button id="calPrevBtn" class="cal-nav-btn">◀</button>
        <div class="cal-month-label">${nomMois}</div>
        <button id="calNextBtn" class="cal-nav-btn">▶</button>
        <button id="calTodayBtn" class="cal-today-btn">Aujourd'hui</button>
      </div>
      <div class="cal-grid">
        ${enTetes}
        ${jours}
      </div>
      <div class="cal-hint">Clique sur un jour pour voir ses rendez-vous.</div>
    </div>
  `;
}

        const statusLabel = ev.done ? 'FAIT' : (ev.paused ? 'EN PAUSE' : (ev.inProgress ? 'EN COURS' : 'PRÉVU'));
        const commentHtml = ev.comment

        const hasPerf = ev.perfBefore || ev.perfAfter || ev.perf060Before || ev.perf060After || ev.hpBefore || ev.hpAfter || ev.torqueBefore || ev.torqueAfter;

  document.querySelectorAll('.transcript-btn').forEach(el => {

function setupVoiceInput(button, textarea){
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    button.style.display = 'none'; // non pris en charge par ce navigateur
    return;
  }
  let recognition = null;
  let listening = false;

  button.onclick = () => {
    if(listening){
      recognition.stop();
      return;
    }
    recognition = new SpeechRecognition();
    recognition.lang = 'fr-FR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      listening = true;
      button.classList.add('listening');
    };
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      const sep = textarea.value.trim() ? ' ' : '';
      textarea.value = textarea.value.trim() + sep + transcript;
      textarea.focus();
    };
    recognition.onerror = () => {
      listening = false;
      button.classList.remove('listening');
    };
    recognition.onend = () => {
      listening = false;
      button.classList.remove('listening');
    };
    recognition.start();
  };
}

function openCommentModal(id, currentComment, kind = 'event'){

    <div class="modal">
      <h3>Commentaire sur ${kind === 'remote' ? 'ce dossier' : 'ce rendez-vous'}</h3>
      <div class="textarea-wrap">

        <button type="button" id="voiceBtn" class="voice-btn" title="Dictée vocale">🎤</button>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelComment">Annuler</button>

// Rendu partagé "bulles Client/Assistant" à partir du texte brut renvoyé par le Worker (format
// "Client : ..." / "Assistant : ..." séparé par des lignes vides) — utilisé à la fois pour la
// conversation attachée à un rendez-vous et pour la liste des conversations sans RDV ci-dessous.
function renderTranscriptBubbles(conversation){
  const blocs = (conversation || '').split('\n\n').filter(Boolean);
  if(blocs.length === 0) return '<div class="search-hint">Aucune conversation enregistrée.</div>';
  return blocs.map(bloc => {
    const estClient = bloc.startsWith('Client :');
    const texte = bloc.replace(/^(Client|Assistant)\s*:\s*/, '');
    return `<div class="transcript-line ${estClient ? 'transcript-client' : 'transcript-assistant'}">
      <div class="transcript-who">${estClient ? 'Client' : 'Assistant'}</div>
      <div class="transcript-text">${escapeHtml(texte)}</div>
    </div>`;
  }).join('');
}

function formatConvDate(iso){
  if(!iso) return '';
  try{ return new Date(iso).toLocaleString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
  catch(e){ return iso; }
}

function openTranscriptModal(conversation){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal modal-transcript">
      <h3>💬 Conversation avec l'assistant</h3>
      <div class="transcript-body">${renderTranscriptBubbles(conversation)}</div>
      <div class="modal-actions">
        <button class="btn-cancel" id="closeTranscript">Fermer</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  document.getElementById('closeTranscript').onclick = () => overlay.remove();
